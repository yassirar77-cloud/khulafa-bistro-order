<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khulafa Bistro - Order Now</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #2D3748;
            --accent: #F7FAFC;
            --text: #2D3748;
            --light-text: #718096;
            --white: #FFFFFF;
            --success: #48BB78;
            --warning: #ED8936;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: var(--text);
            padding-bottom: 100px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 25px 20px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            border-radius: 0 0 var(--radius) var(--radius);
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
        }

        .logo i {
            font-size: 28px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .order-type {
            background: var(--white);
            padding: 20px;
            margin: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .order-type h3 {
            margin-bottom: 15px;
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
        }

        .type-buttons {
            display: flex;
            gap: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--primary);
            background: var(--white);
            color: var(--primary);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .type-btn.active {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
        }

        .arrival-time {
            margin-top: 18px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .arrival-time.show {
            display: block;
        }

        .arrival-time label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        .arrival-time input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
        }

        .arrival-time input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .search-box {
            padding: 0 20px;
            margin: 20px 0;
        }

        .search-container {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 16px;
            background: var(--white);
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.15);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-text);
            font-size: 18px;
        }

        .category {
            margin: 25px 20px;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .category-header {
            background: linear-gradient(135deg, var(--secondary) 0%, #4A5568 100%);
            color: var(--white);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .category-count {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .menu-items {
            padding: 10px;
        }

        .menu-item {
            display: flex;
            padding: 18px;
            border-bottom: 1px solid #f1f1f1;
            transition: var(--transition);
        }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f8f9fa;
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFD8CB 0%, var(--primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 32px;
            margin-right: 18px;
            flex-shrink: 0;
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--secondary);
            font-size: 17px;
        }

        .item-price {
            color: var(--primary);
            font-weight: 800;
            font-size: 18px;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: 0 4px 8px rgba(255, 107, 53, 0.3);
        }

        .qty-btn:hover {
            transform: scale(1.1);
            background: var(--primary-dark);
        }

        .qty-display {
            min-width: 36px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--secondary);
        }

        .cart-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: none;
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .cart-summary.show {
            display: block;
            animation: slideUp 0.3s ease;
        }

        .cart-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cart-details {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 15px;
            color: var(--light-text);
            margin-bottom: 4px;
        }

        .cart-total {
            font-weight: 800;
            font-size: 22px;
            color: var(--primary);
        }

        .checkout-btn {
            padding: 16px 30px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.4);
        }

        .checkout-btn:disabled {
            background: #e2e8f0;
            color: var(--light-text);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--light-text);
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--secondary);
            transform: rotate(90deg);
        }

        .order-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-total {
            font-weight: 800;
            font-size: 20px;
            color: var(--primary);
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px dashed #dee2e6;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .qr-container {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }

        .qr-title {
            margin-bottom: 15px;
            font-weight: 700;
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .qr-image {
            max-width: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto;
            display: block;
        }

        .download-btn {
            background: #FFD700;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: #FFC400;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #f8f9fa;
        }

        .upload-area:hover {
            background: #e9ecef;
            border-color: var(--primary-dark);
        }

        .upload-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .upload-text {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .upload-hint {
            color: var(--light-text);
            font-size: 14px;
        }

        .file-name {
            margin-top: 15px;
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--secondary);
        }

        .btn-secondary:hover {
            background: #cbd5e0;
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 107, 53, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--light-text);
        }

        .empty-state i {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .notification {
            position: fixed;
            top: 20px;
            right: 20px;
            background: var(--success);
            color: var(--white);
            padding: 15px 20px;
            border-radius: 12px;
            box-shadow: var(--shadow);
            z-index: 1001;
            display: none;
            animation: slideInRight 0.3s ease;
        }

        @keyframes slideInRight {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-utensils"></i>
        </div>
        <h1>Khulafa Bistro</h1>
        <p>Delicious food delivered to your table</p>
    </div>

    <div class="order-type">
        <h3>Select Order Type:</h3>
        <div class="type-buttons">
            <button class="type-btn active" data-type="pickup">
                <i class="fas fa-box"></i> Pickup
            </button>
            <button class="type-btn" data-type="dine_in">
                <i class="fas fa-utensils"></i> Dine-In
            </button>
        </div>
        <div class="arrival-time" id="arrivalTimeSection">
            <label>Arrival Time:</label>
            <input type="datetime-local" id="arrivalTime">
        </div>
    </div>

    <div class="search-box">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search menu...">
        </div>
    </div>

    <div id="menuContainer">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading menu...</p>
        </div>
    </div>

    <div class="cart-summary" id="cartSummary">
        <div class="cart-info">
            <div class="cart-details">
                <div class="cart-count" id="cartCount">0 items</div>
                <div class="cart-total">RM <span id="cartTotal">0.00</span></div>
            </div>
            <button class="checkout-btn" id="checkoutButton" onclick="showCheckout()">
                <i class="fas fa-shopping-bag"></i> Checkout
            </button>
        </div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Checkout</h2>
                <button class="close-btn" onclick="closeCheckout()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="order-summary" id="orderSummary"></div>

            <div class="form-group">
                <label class="form-label">Name:</label>
                <input type="text" id="customerName" class="form-input" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number:</label>
                <input type="tel" id="customerPhone" class="form-input" placeholder="01X-XXXXXXX">
            </div>

            <div class="qr-container" id="qrCodeSection" style="display: none;">
                <h3 class="qr-title">
                    <i class="fas fa-qrcode"></i> Scan to Pay with Maybank
                </h3>
                <img id="qrImage" class="qr-image" src="" alt="Payment QR Code">
                <p style="margin-top: 10px; color: var(--light-text);">Scan with your banking app</p>
                <button onclick="downloadQRCode()" class="download-btn">
                    <i class="fas fa-download"></i> Download QR Code
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Payment Screenshot:</label>
                <div class="upload-area" onclick="document.getElementById('paymentFile').click()">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">Click to upload payment screenshot</div>
                    <div class="upload-hint">JPG, PNG or GIF (Max 5MB)</div>
                    <input type="file" id="paymentFile" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                    <div id="fileName" class="file-name"></div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" onclick="closeCheckout()">Cancel</button>
                <button class="modal-btn btn-primary" onclick="submitOrder()">
                    <i class="fas fa-paper-plane"></i> Submit Order
                </button>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let menu = {};
        let cart = {};
        let orderType = 'pickup';
        let selectedFile = null;
        const API_URL = 'https://khulafa-bistro-order.onrender.com/api';

        // Initialize the app
        function init() {
            loadMenu();
            setupEventListeners();
            updateCartSummary();
        }

        async function loadMenu() {
            try {
                const response = await fetch(`${API_URL}/menu`);
                const data = await response.json();
                menu = data.menu;
                renderMenu();
            } catch (error) {
                console.error('Error loading menu:', error);
                showError('Error loading menu. Please refresh.');
            }
        }

        function renderMenu(searchTerm = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            let hasItems = false;

            for (const [category, items] of Object.entries(menu)) {
                const filteredItems = searchTerm 
                    ? items.filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()))
                    : items;

                if (filteredItems.length === 0) continue;

                hasItems = true;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                
                categoryDiv.innerHTML = `
                    <div class="category-header">
                        <span>${category}</span>
                        <span class="category-count">${filteredItems.length} items</span>
                    </div>
                    <div class="menu-items"></div>
                `;

                const menuItemsContainer = categoryDiv.querySelector('.menu-items');

                filteredItems.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    const quantity = cart[item.id]?.quantity || 0;

                    itemDiv.innerHTML = `
                        <div class="item-image">
                            <i class="fas fa-${getItemIcon(item.name)}"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">RM ${item.price.toFixed(2)}</div>
                        </div>
                        <div class="item-controls">
                            ${quantity > 0 ? `
                                <button class="qty-btn" onclick="updateCart(${item.id}, -1)">−</button>
                                <div class="qty-display">${quantity}</div>
                                <button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button>
                            ` : `
                                <button class="qty-btn" onclick="updateCart(${item.id}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                            `}
                        </div>
                    `;

                    menuItemsContainer.appendChild(itemDiv);
                });

                container.appendChild(categoryDiv);
            }

            if (!hasItems) {
                container.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search"></i>
                        <p>No items found</p>
                    </div>
                `;
            }
        }

        function getItemIcon(itemName) {
            const icons = {
                '100 Plus': 'wine-bottle',
                'Air Tin': 'beer',
                'Bobo Boy': 'cocktail',
                'Coke Tin': 'wine-bottle',
                'Lychee Kota': 'cocktail',
                'Orange Juice': 'wine-bottle',
                'Apple Juice': 'wine-bottle',
                'Mineral Water': 'wine-bottle',
                'Teh Tarik': 'mug-hot'
            };
            
            return icons[itemName] || 'wine-bottle';
        }

        function updateCart(itemId, change) {
            let item = null;
            for (const items of Object.values(menu)) {
                item = items.find(i => i.id === itemId);
                if (item) break;
            }

            if (!item) return;

            if (!cart[itemId]) {
                cart[itemId] = { ...item, quantity: 0 };
            }

            cart[itemId].quantity += change;

            if (cart[itemId].quantity <= 0) {
                delete cart[itemId];
            }

            updateCartSummary();
            renderMenu(document.getElementById('searchInput').value);
            
            // Show notification for add to cart
            if (change > 0) {
                showNotification(`${item.name} added to cart`);
            }
        }

        function updateCartSummary() {
            const cartSummary = document.getElementById('cartSummary');
            const checkoutBtn = document.getElementById('checkoutButton');
            const cartItems = Object.values(cart);
            
            if (cartItems.length === 0) {
                cartSummary.classList.remove('show');
                checkoutBtn.disabled = true;
                return;
            }

            cartSummary.classList.add('show');
            checkoutBtn.disabled = false;

            const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cartCount').textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
            document.getElementById('cartTotal').textContent = totalPrice.toFixed(2);
        }

        function setupEventListeners() {
            // Order type selection
            document.querySelectorAll('.type-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    orderType = btn.dataset.type;

                    const arrivalSection = document.getElementById('arrivalTimeSection');
                    if (orderType === 'dine_in') {
                        arrivalSection.classList.add('show');
                    } else {
                        arrivalSection.classList.remove('show');
                    }
                });
            });

            // Search functionality
            document.getElementById('searchInput').addEventListener('input', (e) => {
                renderMenu(e.target.value);
            });

            // Enter key support for search
            document.getElementById('searchInput').addEventListener('keypress', (e) => {
                if (e.key === 'Enter') {
                    renderMenu(e.target.value);
                }
            });
        }

        async function showCheckout() {
            let summaryHTML = '';
            let total = 0;

            for (const item of Object.values(cart)) {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                summaryHTML += `
                    <div class="summary-item">
                        <span>${item.quantity}x ${item.name}</span>
                        <span>RM ${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }

            summaryHTML += `
                <div class="summary-item summary-total">
                    <span>TOTAL</span>
                    <span>RM ${total.toFixed(2)}</span>
                </div>
            `;

            document.getElementById('orderSummary').innerHTML = summaryHTML;

            try {
                const response = await fetch(`${API_URL}/settings/payment_qr_url`);
                const data = await response.json();
                if (data.value) {
                    document.getElementById('qrImage').src = data.value;
                    document.getElementById('qrCodeSection').style.display = 'block';
                } else {
                    document.getElementById('qrCodeSection').style.display = 'none';
                }
            } catch (error) {
                console.log('No QR code set');
                document.getElementById('qrCodeSection').style.display = 'none';
            }

            // Pre-fill user data if available
            if (tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('customerName').value = `${user.first_name} ${user.last_name || ''}`.trim();
            }

            document.getElementById('checkoutModal').classList.add('show');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('show');
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                // Validate file size (5MB max)
                if (selectedFile.size > 5 * 1024 * 1024) {
                    showError('File size too large. Please select a file smaller than 5MB.');
                    document.getElementById('paymentFile').value = '';
                    selectedFile = null;
                    document.getElementById('fileName').innerHTML = '';
                    return;
                }

                document.getElementById('fileName').innerHTML = 
                    `<i class="fas fa-check-circle"></i> ${selectedFile.name} (${(selectedFile.size / 1024 / 1024).toFixed(1)}MB)`;
            }
        }

        function downloadQRCode() {
            try {
                const qrImage = document.getElementById('qrImage');
                
                if (!qrImage || !qrImage.src) {
                    showError('QR code not available!');
                    return;
                }

                // Create a temporary link to download the image
                const link = document.createElement('a');
                link.href = qrImage.src;
                link.download = 'khulafa-maybank-qr.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                showNotification('QR Code downloaded successfully!');
            } catch (error) {
                console.error('Download error:', error);
                showError('Could not download QR code. Please take a screenshot instead.');
            }
        }

        async function submitOrder() {
            const name = document.getElementById('customerName').value.trim();
            const phone = document.getElementById('customerPhone').value.trim();

            if (!name) {
                showError('Please enter your name');
                return;
            }

            if (!phone) {
                showError('Please enter your phone number');
                return;
            }

            // Basic phone validation
            const phoneRegex = /^01[0-9]-?[0-9]{7,8}$/;
            if (!phoneRegex.test(phone)) {
                showError('Please enter a valid phone number (01X-XXXXXXX)');
                return;
            }

            if (!selectedFile) {
                showError('Please upload payment screenshot');
                return;
            }

            let arrivalTime = null;
            if (orderType === 'dine_in') {
                arrivalTime = document.getElementById('arrivalTime').value;
                if (!arrivalTime) {
                    showError('Please select arrival time for dine-in');
                    return;
                }
            }

            const orderData = {
                customer_telegram_id: tg.initDataUnsafe.user?.id.toString() || 'unknown',
                customer_name: name,
                customer_phone: phone,
                order_type: orderType,
                arrival_time: arrivalTime,
                items: Object.values(cart).map(item => ({
                    menu_item_id: item.id,
                    quantity: item.quantity,
                    note: null
                }))
            };

            try {
                // Show loading state
                const submitBtn = document.querySelector('.btn-primary');
                const originalText = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing...';
                submitBtn.disabled = true;

                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const result = await response.json();

                const formData = new FormData();
                formData.append('file', selectedFile);

                const uploadResponse = await fetch(`${API_URL}/orders/${result.order_id}/upload_payment`, {
                    method: 'POST',
                    body: formData
                });

                if (!uploadResponse.ok) {
                    throw new Error('Failed to upload payment screenshot');
                }

                showNotification(`Order placed successfully!\nOrder #${result.order_number}\nTotal: RM ${result.total_price.toFixed(2)}`);
                
                // Reset everything
                cart = {};
                selectedFile = null;
                updateCartSummary();
                renderMenu();
                closeCheckout();

                // Reset form
                document.getElementById('customerName').value = '';
                document.getElementById('customerPhone').value = '';
                document.getElementById('fileName').innerHTML = '';
                document.getElementById('paymentFile').value = '';

            } catch (error) {
                console.error('Error submitting order:', error);
                showError('Error placing order. Please try again.');
            } finally {
                // Reset button state
                const submitBtn = document.querySelector('.btn-primary');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Order';
                submitBtn.disabled = false;
            }
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
            }, 3000);
        }

        function showError(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.style.background = '#E53E3E';
            notification.style.display = 'block';
            
            setTimeout(() => {
                notification.style.display = 'none';
                notification.style.background = '';
            }, 3000);
        }

        // Initialize the app when DOM is loaded
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
