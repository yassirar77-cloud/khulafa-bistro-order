<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Khulafa Bistro - Order Now</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #FF6B35;
            --primary-dark: #E55A2B;
            --secondary: #2D3748;
            --accent: #F7FAFC;
            --text: #2D3748;
            --light-text: #718096;
            --white: #FFFFFF;
            --success: #48BB78;
            --warning: #ED8936;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
            --radius: 16px;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
            color: var(--text);
            padding-bottom: 100px;
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
        }

        .header {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: var(--white);
            padding: 25px 20px 20px;
            text-align: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow);
            border-radius: 0 0 var(--radius) var(--radius);
            animation: slideDown 0.5s ease;
        }

        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 8px;
            animation: bounce 1s ease infinite;
        }

        .logo i {
            font-size: 28px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 800;
            margin-bottom: 5px;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            opacity: 0.9;
            font-weight: 500;
        }

        .order-type {
            background: var(--white);
            padding: 20px;
            margin: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            animation: fadeInUp 0.6s ease;
        }

        .order-type h3 {
            margin-bottom: 15px;
            color: var(--secondary);
            font-weight: 700;
            font-size: 18px;
        }

        .type-buttons {
            display: flex;
            gap: 12px;
        }

        .type-btn {
            flex: 1;
            padding: 14px;
            border: 2px solid var(--primary);
            background: var(--white);
            color: var(--primary);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .type-btn:active {
            transform: scale(0.95);
        }

        .type-btn.active {
            background: var(--primary);
            color: var(--white);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.3);
            animation: pulse 1.5s ease infinite;
        }

        .arrival-time {
            margin-top: 18px;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .arrival-time.show {
            display: block;
        }

        .arrival-time label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        .arrival-time input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
        }

        .arrival-time input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
        }

        .search-box {
            padding: 0 20px;
            margin: 20px 0;
            animation: fadeInUp 0.7s ease;
        }

        .search-container {
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 16px 20px 16px 50px;
            border: 2px solid #e2e8f0;
            border-radius: 50px;
            font-size: 16px;
            background: var(--white);
            transition: var(--transition);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .search-box input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.15);
            transform: translateY(-2px);
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--light-text);
            font-size: 18px;
            animation: rotate 2s linear infinite;
        }

        .category {
            margin: 25px 20px;
            background: var(--white);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: var(--shadow);
            animation: fadeInUp 0.8s ease;
        }

        .category-header {
            background: linear-gradient(135deg, var(--secondary) 0%, #4A5568 100%);
            color: var(--white);
            padding: 18px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
        }

        .category-count {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 14px;
            animation: fadeIn 1s ease;
        }

        .menu-items {
            padding: 10px;
        }

        .menu-item {
            display: flex;
            padding: 18px;
            border-bottom: 1px solid #f1f1f1;
            transition: var(--transition);
            opacity: 0;
            animation: slideInLeft 0.5s ease forwards;
        }

        .menu-item:nth-child(1) { animation-delay: 0.1s; }
        .menu-item:nth-child(2) { animation-delay: 0.2s; }
        .menu-item:nth-child(3) { animation-delay: 0.3s; }
        .menu-item:nth-child(4) { animation-delay: 0.4s; }
        .menu-item:nth-child(5) { animation-delay: 0.5s; }

        .menu-item:last-child {
            border-bottom: none;
        }

        .menu-item:hover {
            background: #f8f9fa;
            transform: translateX(5px);
        }

        .item-image {
            width: 80px;
            height: 80px;
            border-radius: 12px;
            background: linear-gradient(135deg, #FFD8CB 0%, var(--primary) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--white);
            font-size: 32px;
            margin-right: 18px;
            flex-shrink: 0;
            animation: float 3s ease-in-out infinite;
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.3);
            position: relative;
            overflow: hidden;
        }

        .item-image::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(
                45deg,
                transparent,
                rgba(255, 255, 255, 0.3),
                transparent
            );
            animation: shine 3s infinite;
        }

        .item-image i {
            z-index: 1;
            animation: iconBounce 2s ease-in-out infinite;
        }

        .item-info {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .item-name {
            font-weight: 700;
            margin-bottom: 6px;
            color: var(--secondary);
            font-size: 17px;
        }

        .item-price {
            color: var(--primary);
            font-weight: 800;
            font-size: 18px;
            animation: priceGlow 2s ease-in-out infinite;
        }

        .item-controls {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .qty-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: var(--primary);
            color: var(--white);
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition);
            box-shadow: 0 4px 8px rgba(255, 107, 53, 0.3);
        }

        .qty-btn:hover {
            transform: scale(1.15) rotate(15deg);
            background: var(--primary-dark);
            box-shadow: 0 6px 12px rgba(255, 107, 53, 0.5);
        }

        .qty-btn:active {
            transform: scale(0.9);
        }

        .qty-display {
            min-width: 36px;
            text-align: center;
            font-weight: 700;
            font-size: 18px;
            color: var(--secondary);
            animation: countUp 0.3s ease;
        }

        .add-btn {
            background: var(--primary);
            color: var(--white);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 8px rgba(255, 107, 53, 0.3);
            animation: wiggle 2s ease-in-out infinite;
        }

        .add-btn:hover {
            transform: scale(1.15) rotate(90deg);
            background: var(--primary-dark);
            box-shadow: 0 6px 12px rgba(255, 107, 53, 0.5);
        }

        .add-btn:active {
            transform: scale(0.9) rotate(90deg);
        }

        .cart-summary {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--white);
            padding: 20px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            display: none;
            z-index: 100;
            max-width: 480px;
            margin: 0 auto;
            border-radius: var(--radius) var(--radius) 0 0;
        }

        .cart-summary.show {
            display: block;
            animation: slideUp 0.4s ease;
        }

        .cart-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .cart-details {
            display: flex;
            flex-direction: column;
        }

        .cart-count {
            font-size: 15px;
            color: var(--light-text);
            margin-bottom: 4px;
        }

        .cart-total {
            font-weight: 800;
            font-size: 22px;
            color: var(--primary);
            animation: totalPulse 1.5s ease-in-out infinite;
        }

        .checkout-btn {
            padding: 16px 30px;
            background: var(--primary);
            color: var(--white);
            border: none;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            animation: buttonPulse 2s ease-in-out infinite;
        }

        .checkout-btn:hover {
            background: var(--primary-dark);
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 8px 20px rgba(255, 107, 53, 0.5);
        }

        .checkout-btn:active {
            transform: translateY(-1px) scale(0.98);
        }

        .checkout-btn i {
            animation: bagSwing 1.5s ease-in-out infinite;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.6);
            z-index: 1000;
            align-items: center;
            justify-content: center;
            padding: 20px;
            animation: fadeIn 0.3s ease;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: var(--white);
            padding: 30px;
            border-radius: var(--radius);
            width: 100%;
            max-width: 450px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: scaleIn 0.3s ease;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .modal-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--secondary);
        }

        .close-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: var(--light-text);
            transition: var(--transition);
        }

        .close-btn:hover {
            color: var(--secondary);
            transform: rotate(90deg) scale(1.2);
        }

        .order-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #e9ecef;
            animation: fadeIn 0.5s ease;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-total {
            font-weight: 800;
            font-size: 20px;
            color: var(--primary);
            margin-top: 10px;
            padding-top: 15px;
            border-top: 2px dashed #dee2e6;
            animation: totalPulse 1.5s ease-in-out infinite;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: var(--secondary);
        }

        .form-input {
            width: 100%;
            padding: 16px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-size: 16px;
            transition: var(--transition);
        }

        .form-input:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.2);
            transform: translateY(-2px);
        }

        .qr-container {
            text-align: center;
            margin: 25px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
            animation: fadeIn 0.5s ease;
        }

        .qr-title {
            margin-bottom: 15px;
            font-weight: 700;
            color: var(--secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .qr-title i {
            animation: qrScan 2s ease-in-out infinite;
        }

        .qr-image {
            max-width: 250px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            margin: 0 auto;
            display: block;
            animation: qrFloat 3s ease-in-out infinite;
        }

        .download-btn {
            background: #FFD700;
            color: #000;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            margin-top: 15px;
            cursor: pointer;
            font-weight: 700;
            font-size: 16px;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .download-btn:hover {
            background: #FFC400;
            transform: translateY(-2px) scale(1.05);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.3);
        }

        .download-btn i {
            animation: downloadBounce 1s ease-in-out infinite;
        }

        .upload-area {
            border: 2px dashed var(--primary);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            cursor: pointer;
            transition: var(--transition);
            background: #f8f9fa;
        }

        .upload-area:hover {
            background: #e9ecef;
            border-color: var(--primary-dark);
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 40px;
            color: var(--primary);
            margin-bottom: 10px;
            animation: uploadFloat 2s ease-in-out infinite;
        }

        .upload-text {
            font-weight: 600;
            color: var(--secondary);
            margin-bottom: 5px;
        }

        .upload-hint {
            color: var(--light-text);
            font-size: 14px;
        }

        .file-name {
            margin-top: 15px;
            color: var(--success);
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            animation: fadeIn 0.5s ease;
        }

        .modal-buttons {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--transition);
        }

        .btn-primary {
            background: var(--primary);
            color: var(--white);
            box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(255, 107, 53, 0.4);
        }

        .btn-secondary {
            background: #e2e8f0;
            color: var(--secondary);
        }

        .btn-secondary:hover {
            background: #cbd5e0;
            transform: translateY(-2px);
        }

        .loading {
            text-align: center;
            padding: 50px 20px;
            color: var(--primary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }

        .loading-spinner {
            width: 40px;
            height: 40px;
            border: 4px solid rgba(255, 107, 53, 0.3);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s linear infinite;
        }

        .empty-cart {
            text-align: center;
            padding: 40px 20px;
            color: var(--light-text);
        }

        .empty-cart i {
            font-size: 60px;
            margin-bottom: 15px;
            opacity: 0.5;
            animation: float 3s ease-in-out infinite;
        }

        /* ANIMATIONS */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideDown {
            from {
                transform: translateY(-100%);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        @keyframes slideInLeft {
            from {
                opacity: 0;
                transform: translateX(-50px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from { 
                transform: scale(0.9); 
                opacity: 0; 
            }
            to { 
                transform: scale(1); 
                opacity: 1; 
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
        }

        @keyframes pulse {
            0%, 100% { transform: translateY(-2px) scale(1); }
            50% { transform: translateY(-2px) scale(1.05); }
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-5deg); }
            75% { transform: rotate(5deg); }
        }

        @keyframes shine {
            0% { transform: translate(-50%, -50%) rotate(0deg); }
            100% { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes iconBounce {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes priceGlow {
            0%, 100% { text-shadow: 0 0 5px rgba(255, 107, 53, 0.5); }
            50% { text-shadow: 0 0 20px rgba(255, 107, 53, 0.8); }
        }

        @keyframes totalPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        @keyframes buttonPulse {
            0%, 100% { box-shadow: 0 4px 12px rgba(255, 107, 53, 0.3); }
            50% { box-shadow: 0 6px 20px rgba(255, 107, 53, 0.5); }
        }

        @keyframes bagSwing {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(-10deg); }
            75% { transform: rotate(10deg); }
        }

        @keyframes qrScan {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        @keyframes qrFloat {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-5px) rotate(2deg); }
        }

        @keyframes downloadBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }

        @keyframes uploadFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        @keyframes rotate {
            0% { transform: translateY(-50%) rotate(0deg); }
            100% { transform: translateY(-50%) rotate(360deg); }
        }

        @keyframes countUp {
            from { transform: scale(0.5); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="logo">
            <i class="fas fa-utensils"></i>
        </div>
        <h1>Khulafa Bistro</h1>
        <p>Delicious food delivered to your table</p>
    </div>

    <div class="order-type">
        <h3>Select Order Type:</h3>
        <div class="type-buttons">
            <button class="type-btn active" data-type="pickup">
                <i class="fas fa-box"></i> Pickup
            </button>
            <button class="type-btn" data-type="dine_in">
                <i class="fas fa-utensils"></i> Dine-In
            </button>
        </div>
        <div class="arrival-time" id="arrivalTimeSection">
            <label>Arrival Time:</label>
            <input type="datetime-local" id="arrivalTime">
        </div>
    </div>

    <div class="search-box">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="searchInput" placeholder="Search menu...">
        </div>
    </div>

    <div id="menuContainer">
        <div class="loading">
            <div class="loading-spinner"></div>
            <p>Loading delicious menu...</p>
        </div>
    </div>

    <div class="cart-summary" id="cartSummary">
        <div class="cart-info">
            <div class="cart-details">
                <div class="cart-count" id="cartCount">0 items</div>
                <div class="cart-total">RM <span id="cartTotal">0.00</span></div>
            </div>
            <button class="checkout-btn" onclick="showCheckout()">
                <i class="fas fa-shopping-bag"></i> Checkout
            </button>
        </div>
    </div>

    <div class="modal" id="checkoutModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title">Checkout</h2>
                <button class="close-btn" onclick="closeCheckout()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            
            <div class="order-summary" id="orderSummary"></div>

            <div class="form-group">
                <label class="form-label">Name:</label>
                <input type="text" id="customerName" class="form-input" placeholder="Enter your name">
            </div>

            <div class="form-group">
                <label class="form-label">Phone Number:</label>
                <input type="tel" id="customerPhone" class="form-input" placeholder="01X-XXXXXXX">
            </div>

            <div class="qr-container" id="qrCodeSection" style="display: none;">
                <h3 class="qr-title">
                    <i class="fas fa-qrcode"></i> Scan to Pay with Maybank
                </h3>
                <img id="qrImage" class="qr-image" src="" alt="Payment QR Code">
                <p style="margin-top: 10px; color: var(--light-text);">Scan with your banking app</p>
                <button onclick="downloadQRCode()" class="download-btn">
                    <i class="fas fa-download"></i> Download QR Code
                </button>
            </div>

            <div class="form-group">
                <label class="form-label">Upload Payment Screenshot:</label>
                <div class="upload-area" onclick="document.getElementById('paymentFile').click()">
                    <div class="upload-icon">
                        <i class="fas fa-cloud-upload-alt"></i>
                    </div>
                    <div class="upload-text">Click to upload payment screenshot</div>
                    <div class="upload-hint">JPG, PNG or GIF (Max 5MB)</div>
                    <input type="file" id="paymentFile" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
                    <div id="fileName" class="file-name"></div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn btn-secondary" onclick="closeCheckout()">Cancel</button>
                <button class="modal-btn btn-primary" onclick="submitOrder()">
                    <i class="fas fa-paper-plane"></i> Submit Order
                </button>
            </div>
        </div>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let menu = {};
        let cart = {};
        let orderType = 'pickup';
        let selectedFile = null;
        const API_URL = 'https://khulafaorder.pythonanywhere.com/api';

        async function loadMenu() {
            try {
                const response = await fetch(`${API_URL}/menu`);
                const data = await response.json();
                menu = data.menu;
                renderMenu();
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('menuContainer').innerHTML = 
                    '<div class="loading">Error loading menu. Please refresh.</div>';
            }
        }

        function renderMenu(searchTerm = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';

            for (const [category, items] of Object.entries(menu)) {
                const filteredItems = searchTerm 
                    ? items.filter(item => item.name.toLowerCase().includes(searchTerm.toLowerCase()))
                    : items;

                if (filteredItems.length === 0) continue;

                const categoryDiv = document.createElement('div');
                categoryDiv.className = 'category';
                
                categoryDiv.innerHTML = `
                    <div class="category-header">
                        <span>${category}</span>
                        <span class="category-count">${filteredItems.length} items</span>
                    </div>
                    <div class="menu-items"></div>
                `;

                const menuItemsContainer = categoryDiv.querySelector('.menu-items');

                filteredItems.forEach(item => {
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'menu-item';
                    const quantity = cart[item.id]?.quantity || 0;

                    itemDiv.innerHTML = `
                        <div class="item-image">
                            <i class="fas fa-${getItemIcon(item.name)}"></i>
                        </div>
                        <div class="item-info">
                            <div class="item-name">${item.name}</div>
                            <div class="item-price">RM ${item.price.toFixed(2)}</div>
                        </div>
                        <div class="item-controls">
                            ${quantity > 0 ? `
                                <button class="qty-btn" onclick="updateCart(${item.id}, -1)">−</button>
                                <div class="qty-display">${quantity}</div>
                                <button class="qty-btn" onclick="updateCart(${item.id}, 1)">+</button>
                            ` : `
                                <button class="add-btn" onclick="updateCart(${item.id}, 1)">
                                    <i class="fas fa-plus"></i>
                                </button>
                            `}
                        </div>
                    `;

                    menuItemsContainer.appendChild(itemDiv);
                });

                container.appendChild(categoryDiv);
            }

            if (container.innerHTML === '') {
                container.innerHTML = `
                    <div class="empty-cart">
                        <i class="fas fa-search"></i>
                        <p>No items found</p>
                    </div>
                `;
            }
        }

        function getItemIcon(itemName) {
            const name = itemName.toLowerCase();
            
            if (name.includes('100 plus')) return 'wine-bottle';
            if (name.includes('air tin')) return 'beer';
            if (name.includes('bobo')) return 'cocktail';
            if (name.includes('coke')) return 'wine-bottle';
            if (name.includes('lychee')) return 'cocktail';
            if (name.includes('orange') || name.includes('oren')) return 'wine-bottle';
            if (name.includes('apple') || name.includes('epal')) return 'wine-bottle';
            if (name.includes('mineral') || name.includes('air')) return 'wine-bottle';
            if (name.includes('teh') || name.includes('tea')) return 'mug-hot';
            if (name.includes('coffee') || name.includes('kopi')) return 'mug-hot';
            if (name.includes('nasi')) return 'bowl-rice';
            if (name.includes('rice')) return 'bowl-rice';
            if (name.includes('ayam') || name.includes('chicken')) return 'drumstick-bite';
            if (name.includes('kambing') || name.includes('mutton')) return 'bacon';
            if (name.includes('daging') || name.includes('beef')) return 'burger';
            if (name.includes('ikan') || name.includes('fish')) return 'fish';
            if (name.includes('udang') || name.includes('prawn')) return 'shrimp';
            if (name.includes('roti')) return 'bread-slice';
            if (name.includes('mee') || name.includes('noodle')) return 'bowl-food';
            if (name.includes('ice cream') || name.includes('ais krim')) return 'ice-cream';
            if (name.includes('cake') || name.includes('kek')) return 'birthday-cake';
            
            return 'utensils';
        }

        function updateCart(itemId, change) {
            let item = null;
            for (const items of Object.values(menu)) {
                item = items.find(i => i.id === itemId);
                if (item) break;
            }

            if (!item) return;

            if (!cart[itemId]) {
                cart[itemId] = { ...item, quantity: 0 };
            }

            cart[itemId].quantity += change;

            if (cart[itemId].quantity <= 0) {
                delete cart[itemId];
            }

            updateCartSummary();
            renderMenu(document.getElementById('searchInput').value);
        }

        function updateCartSummary() {
            const cartSummary = document.getElementById('cartSummary');
            const cartItems = Object.values(cart);
            
            if (cartItems.length === 0) {
                cartSummary.classList.remove('show');
                return;
            }

            cartSummary.classList.add('show');

            const totalItems = cartItems.reduce((sum, item) => sum + item.quantity, 0);
            const totalPrice = cartItems.reduce((sum, item) => sum + (item.price * item.quantity), 0);

            document.getElementById('cartCount').textContent = `${totalItems} ${totalItems === 1 ? 'item' : 'items'}`;
            document.getElementById('cartTotal').textContent = totalPrice.toFixed(2);
        }

        async function showCheckout() {
            let summaryHTML = '';
            let total = 0;

            for (const item of Object.values(cart)) {
                const itemTotal = item.price * item.quantity;
                total += itemTotal;
                summaryHTML += `
                    <div class="summary-item">
                        <span>${item.quantity}x ${item.name}</span>
                        <span>RM ${itemTotal.toFixed(2)}</span>
                    </div>
                `;
            }

            summaryHTML += `
                <div class="summary-item summary-total">
                    <span>TOTAL</span>
                    <span>RM ${total.toFixed(2)}</span>
                </div>
            `;

            document.getElementById('orderSummary').innerHTML = summaryHTML;

            try {
                const response = await fetch(`${API_URL}/settings/payment_qr_url`);
                const data = await response.json();
                if (data.value) {
                    document.getElementById('qrImage').src = data.value;
                    document.getElementById('qrCodeSection').style.display = 'block';
                }
            } catch (error) {
                console.log('No QR code set');
            }

            if (tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                document.getElementById('customerName').value = `${user.first_name} ${user.last_name || ''}`.trim();
            }

            document.getElementById('checkoutModal').classList.add('show');
        }

        function closeCheckout() {
            document.getElementById('checkoutModal').classList.remove('show');
        }

        function handleFileSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                document.getElementById('fileName').innerHTML = `<i class="fas fa-check-circle"></i> ${selectedFile.name}`;
            }
        }

        function downloadQRCode() {
            try {
                const qrImage = document.getElementById('qrImage');
                
                if (!qrImage || !qrImage.src) {
                    tg.showAlert('QR code not available!');
                    return;
                }

                const link = document.createElement('a');
                link.href = qrImage.src;
                link.download = 'khulafa-maybank-qr.jpg';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
                
                tg.showAlert('QR Code downloaded successfully!');
            } catch (error) {
                console.error('Download error:', error);
                tg.showAlert('Could not download QR code. Please take a screenshot instead.');
            }
        }

        async function submitOrder() {
            const name = document.getElementById('customerName').value;
            const phone = document.getElementById('customerPhone').value;

            if (!name || !phone) {
                tg.showAlert('Please enter your name and phone number');
                return;
            }

            if (!selectedFile) {
                tg.showAlert('Please upload payment screenshot');
                return;
            }

            let arrivalTime = null;
            if (orderType === 'dine_in') {
                arrivalTime = document.getElementById('arrivalTime').value;
                if (!arrivalTime) {
                    tg.showAlert('Please select arrival time for dine-in');
                    return;
                }
            }

            const orderData = {
                customer_telegram_id: tg.initDataUnsafe.user?.id.toString() || 'unknown',
                customer_name: name,
                customer_phone: phone,
                order_type: orderType,
                arrival_time: arrivalTime,
                items: Object.values(cart).map(item => ({
                    menu_item_id: item.id,
                    quantity: item.quantity,
                    note: null
                }))
            };

            try {
                const response = await fetch(`${API_URL}/orders`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });

                const result = await response.json();

                const formData = new FormData();
                formData.append('file', selectedFile);

                await fetch(`${API_URL}/orders/${result.order_id}/upload_payment`, {
                    method: 'POST',
                    body: formData
                });

                tg.showAlert(`Order placed successfully!\n\nOrder Number: ${result.order_number}\nTotal: RM ${result.total_price.toFixed(2)}\n\nWe'll notify you when ready!`);
                
                cart = {};
                updateCartSummary();
                renderMenu();
                closeCheckout();

            } catch (error) {
                console.error('Error submitting order:', error);
                tg.showAlert('Error placing order. Please try again.');
            }
        }

        document.querySelectorAll('.type-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                orderType = btn.dataset.type;

                const arrivalSection = document.getElementById('arrivalTimeSection');
                if (orderType === 'dine_in') {
                    arrivalSection.classList.add('show');
                } else {
                    arrivalSection.classList.remove('show');
                }
            });
        });

        document.getElementById('searchInput').addEventListener('input', (e) => {
            renderMenu(e.target.value);
        });

        loadMenu();
    </script>
</body>
</html>
