<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aisha - Pelayan AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{
            font-family:'Plus Jakarta Sans',sans-serif;
            background:#0D0D0D;color:#ECECEC;
            height:100dvh;overflow:hidden;
            -webkit-tap-highlight-color:transparent;
        }
        .wrap{max-width:500px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;position:relative}

        /* ===== TAP OVERLAY ===== */
        #tapOverlay{
            position:fixed;inset:0;background:rgba(13,13,13,.92);
            display:flex;align-items:center;justify-content:center;
            z-index:100;cursor:pointer;
        }
        #tapOverlay.hide{display:none}
        #tapOverlay .tap-inner{text-align:center}
        #tapOverlay .tap-icon{
            width:72px;height:72px;border-radius:50%;
            background:linear-gradient(135deg,#F97316,#EA580C);
            display:flex;align-items:center;justify-content:center;
            margin:0 auto 16px;
            animation:tapPulse 2s ease infinite;
        }
        #tapOverlay .tap-icon svg{width:32px;height:32px;fill:#fff}
        #tapOverlay .tap-text{font-size:17px;font-weight:600;color:#999}
        #tapOverlay .tap-sub{font-size:13px;color:#555;margin-top:6px}
        @keyframes tapPulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:1}}

        /* ===== HEADER ===== */
        .hdr{
            padding:14px 20px;background:#0D0D0D;border-bottom:1px solid #1A1A1A;
            display:flex;align-items:center;gap:12px;flex-shrink:0;
        }
        .hdr .av{
            width:40px;height:40px;border-radius:50%;
            background:linear-gradient(135deg,#F97316,#EA580C);
            display:flex;align-items:center;justify-content:center;
            font-size:16px;font-weight:700;color:#fff;flex-shrink:0;
        }
        .hdr .info{flex:1}
        .hdr h1{font-size:16px;font-weight:700}
        .hdr .sub{font-size:12px;color:#666}
        .hdr .tbl{
            padding:4px 10px;border-radius:12px;
            background:#1A1A1A;font-size:12px;font-weight:600;color:#F97316;
        }

        /* ===== CHAT AREA ===== */
        #chat{
            flex:1;overflow-y:auto;padding:16px 16px 8px;
            display:flex;flex-direction:column;gap:14px;
            scroll-behavior:smooth;
        }
        .msg{display:flex;gap:10px;max-width:88%;animation:msgIn .25s ease}
        @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
        .msg.ai{align-self:flex-start}
        .msg.user{align-self:flex-end;flex-direction:row-reverse}
        .msg .bbl{padding:11px 15px;border-radius:18px;font-size:15px;line-height:1.5}
        .msg.ai .bbl{background:#1A1A1A;border-bottom-left-radius:4px}
        .msg.user .bbl{background:#F97316;color:#fff;border-bottom-right-radius:4px}
        .msg .ic{
            width:28px;height:28px;border-radius:50%;flex-shrink:0;margin-top:2px;
            display:flex;align-items:center;justify-content:center;
            font-size:12px;font-weight:700;color:#fff;
        }
        .msg.ai .ic{background:linear-gradient(135deg,#F97316,#EA580C)}
        .msg.user .ic{background:#2A2A2A}

        /* Typing indicator */
        .dots{display:flex;gap:5px;padding:12px 16px}
        .dots span{
            width:7px;height:7px;border-radius:50%;background:#555;
            animation:dotBounce 1.4s ease infinite;
        }
        .dots span:nth-child(2){animation-delay:.2s}
        .dots span:nth-child(3){animation-delay:.4s}
        @keyframes dotBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}

        /* ===== ORDER PANEL (slides up from bottom) ===== */
        #orderPanel{
            position:fixed;bottom:0;left:50%;
            transform:translateX(-50%) translateY(100%);
            width:100%;max-width:500px;
            background:#141414;border-radius:20px 20px 0 0;
            border-top:1px solid #2A2A2A;
            padding:0 20px 28px;
            transition:transform .35s cubic-bezier(.4,0,.2,1);
            z-index:60;max-height:65dvh;overflow-y:auto;
        }
        #orderPanel.show{transform:translateX(-50%) translateY(0)}
        .panel-handle{width:40px;height:4px;background:#333;border-radius:2px;margin:12px auto 14px}
        .panel-title{font-size:16px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px}
        .panel-title .cnt{
            background:#F97316;color:#fff;font-size:11px;font-weight:700;
            padding:2px 8px;border-radius:10px;
        }
        .order-list{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
        .order-row{
            display:flex;align-items:center;
            padding:10px 12px;background:#1E1E1E;border-radius:10px;font-size:14px;
        }
        .order-row .qty{
            background:#2A2A2A;color:#F97316;font-weight:700;font-size:12px;
            width:26px;height:26px;border-radius:7px;
            display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-right:10px;
        }
        .order-row .nm{flex:1;font-weight:500}
        .order-row .pr{color:#F97316;font-weight:600;font-size:13px;margin-left:10px}
        .order-total{
            display:flex;justify-content:space-between;align-items:center;
            padding:14px 0;border-top:1px solid #2A2A2A;
            font-size:16px;font-weight:700;margin-bottom:14px;
        }
        .order-total .amt{color:#F97316;font-size:18px}
        .panel-btns{display:flex;gap:10px}
        .panel-btns button{
            flex:1;padding:14px;border:none;border-radius:14px;
            font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;
            transition:background .15s;
        }
        .btn-more{background:#1E1E1E;color:#ECECEC}
        .btn-more:active{background:#2A2A2A}
        .btn-send{background:#22C55E;color:#fff}
        .btn-send:active{background:#16A34A}

        /* ===== MIC BAR ===== */
        .mic-bar{
            padding:14px 20px;background:#111;border-top:1px solid #1A1A1A;
            display:flex;align-items:center;justify-content:center;gap:10px;
            min-height:54px;flex-shrink:0;
        }

        /* Listening state */
        .mic-dot{width:10px;height:10px;border-radius:50%;background:#333;flex-shrink:0}
        .mic-dot.active{background:#EF4444;animation:micPulse 1.5s ease infinite}
        @keyframes micPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.5;transform:scale(1.3)}}
        .mic-text{font-size:13px;color:#555}
        .mic-text.active{color:#EF4444}

        /* Audio playing bars */
        .audio-indicator{display:flex;align-items:center;gap:8px;color:#F97316;font-size:13px}
        .audio-bars{display:flex;gap:2px;height:18px;align-items:flex-end}
        .audio-bars span{width:3px;background:#F97316;border-radius:2px;animation:barAnim .8s ease infinite}
        .audio-bars span:nth-child(1){height:6px}
        .audio-bars span:nth-child(2){height:14px;animation-delay:.15s}
        .audio-bars span:nth-child(3){height:10px;animation-delay:.3s}
        .audio-bars span:nth-child(4){height:16px;animation-delay:.45s}
        .audio-bars span:nth-child(5){height:8px;animation-delay:.6s}
        @keyframes barAnim{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1.2)}}

        /* Sound wave for listening */
        .wave-bars{display:flex;gap:3px;height:20px;align-items:center}
        .wave-bars span{
            width:3px;border-radius:2px;background:#EF4444;
            animation:waveAnim .6s ease infinite alternate;
        }
        .wave-bars span:nth-child(1){height:8px;animation-delay:0s}
        .wave-bars span:nth-child(2){height:14px;animation-delay:.1s}
        .wave-bars span:nth-child(3){height:18px;animation-delay:.2s}
        .wave-bars span:nth-child(4){height:14px;animation-delay:.3s}
        .wave-bars span:nth-child(5){height:8px;animation-delay:.4s}
        @keyframes waveAnim{from{transform:scaleY(.4)}to{transform:scaleY(1)}}

        /* ===== SUCCESS OVERLAY ===== */
        #successOverlay{
            position:fixed;inset:0;background:rgba(13,13,13,.95);
            display:none;align-items:center;justify-content:center;
            z-index:200;flex-direction:column;gap:16px;
        }
        #successOverlay.show{display:flex}
        .success-check{
            width:80px;height:80px;border-radius:50%;
            background:#22C55E;
            display:flex;align-items:center;justify-content:center;
            animation:checkPop .4s cubic-bezier(.4,0,.2,1);
        }
        .success-check svg{width:40px;height:40px;fill:#fff}
        @keyframes checkPop{from{transform:scale(0)}to{transform:scale(1)}}
        .success-text{font-size:22px;font-weight:700;color:#fff}
        .success-sub{font-size:14px;color:#666}

        /* ===== DISAMBIGUATION BUTTONS ===== */
        .disambig-wrap{
            display:flex;flex-direction:column;gap:6px;
            padding:4px 0;
        }
        .disambig-btn{
            display:block;width:100%;text-align:left;
            padding:10px 14px;border:1px solid #2A2A2A;border-radius:12px;
            background:#1A1A1A;color:#ECECEC;font-size:14px;font-weight:500;
            font-family:inherit;cursor:pointer;transition:background .15s,border-color .15s;
        }
        .disambig-btn:active{background:#2A2A2A;border-color:#F97316}
        .disambig-price{color:#F97316;font-weight:600;float:right}

        /* ===== TEXT SUGGESTION (no audio) ===== */
        .suggestion-bubble{
            padding:8px 14px;border-radius:14px;font-size:13px;
            background:#1A1A1A;color:#888;border:1px dashed #333;
            margin-left:38px;max-width:80%;
        }
    </style>
</head>
<body>

<!-- Tap overlay (needed for mic permission) -->
<div id="tapOverlay" onclick="startOrder()">
    <div class="tap-inner">
        <div class="tap-icon">
            <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
        </div>
        <div class="tap-text">Ketuk untuk mula</div>
        <div class="tap-sub">Tap to start ordering</div>
    </div>
</div>

<!-- Main App -->
<div class="wrap">
    <!-- Header -->
    <div class="hdr">
        <div class="av">A</div>
        <div class="info">
            <h1>Aisha</h1>
            <div class="sub">Pelayan AI</div>
        </div>
        <div class="tbl" id="tableBadge">-</div>
    </div>

    <!-- Chat -->
    <div id="chat"></div>

    <!-- Mic bar -->
    <div class="mic-bar" id="micBar">
        <div class="mic-dot" id="micDot"></div>
        <span class="mic-text" id="micText">Menunggu...</span>
    </div>
</div>

<!-- Order Panel -->
<div id="orderPanel">
    <div class="panel-handle"></div>
    <div class="panel-title">Pesanan Anda <span class="cnt" id="orderCount">0</span></div>
    <div class="order-list" id="orderList"></div>
    <div class="order-total">
        <span>Jumlah</span>
        <span class="amt" id="orderTotal">RM 0.00</span>
    </div>
    <div class="panel-btns">
        <button class="btn-more" onclick="addMore()">Tambah Lagi</button>
        <button class="btn-send" onclick="submitOrder()">Hantar Order</button>
    </div>
</div>

<!-- Success overlay -->
<div id="successOverlay">
    <div class="success-check">
        <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41L9 16.17z"/></svg>
    </div>
    <div class="success-text">Order Dihantar!</div>
    <div class="success-sub">Pesanan anda sedang diproses</div>
</div>

<script>
// ===== CONFIG =====
const TABLE = new URLSearchParams(location.search).get('table')
    || location.pathname.split('/').filter(Boolean).pop() || 'T01';

// ===== STATE =====
let recognition = null;
let shouldListen = false;
let isPlaying = false;
let currentAudio = null;
let order = [];          // [{name, qty, price}, ...]
let panelOpen = false;
let started = false;

document.getElementById('tableBadge').textContent = TABLE;

// ===== START =====
async function startOrder() {
    if (started) return;
    started = true;
    document.getElementById('tapOverlay').classList.add('hide');
    initSpeechRecognition();
    shouldListen = true;
    try { recognition.start(); } catch(e) {}
    setMicState('listening');

    // Fetch greeting
    try {
        const res = await fetch('/api/voice/greeting');
        const data = await res.json();
        addMessage('ai', data.text);
        if (data.has_audio && data.audio_matches && data.audio_matches.length) {
            await playAudioSequence(data.audio_matches);
        }
    } catch(e) {
        addMessage('ai', 'Hai! Saya Aisha. Nak order apa hari ini?');
    }
}

// ===== SPEECH RECOGNITION =====
function initSpeechRecognition() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) {
        addMessage('ai', 'Maaf, browser tidak support voice. Sila guna Chrome.');
        return;
    }
    recognition = new SR();
    recognition.lang = 'ms-MY';
    recognition.continuous = false;
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    recognition.onresult = (e) => {
        const result = e.results[0];
        if (result && result.isFinal) {
            const text = result[0].transcript.trim();
            if (text) {
                pauseMic();
                processMessage(text);
            }
        }
    };

    recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
            setMicState('error', 'Sila benarkan mikrofon');
        } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
            setTimeout(() => { if (shouldListen && !isPlaying) restartMic(); }, 400);
        }
    };

    recognition.onend = () => {
        if (shouldListen && !isPlaying) {
            restartMic();
        }
    };
}

function restartMic() {
    if (!recognition || !shouldListen) return;
    try { recognition.start(); } catch(e) {}
    setMicState('listening');
}

function pauseMic() {
    shouldListen = false;
    try { recognition.stop(); } catch(e) {}
    setMicState('processing');
}

function resumeMic() {
    if (!recognition) return;
    shouldListen = true;
    restartMic();
}

function setMicState(state, customText) {
    const bar = document.getElementById('micBar');
    if (state === 'listening') {
        bar.innerHTML = '<div class="wave-bars"><span></span><span></span><span></span><span></span><span></span></div><span class="mic-text active">Mendengar...</span>';
    } else if (state === 'processing') {
        bar.innerHTML = '<div class="mic-dot"></div><span class="mic-text">Memproses...</span>';
    } else if (state === 'playing') {
        bar.innerHTML = '<div class="audio-indicator"><div class="audio-bars"><span></span><span></span><span></span><span></span><span></span></div><span>Aisha bercakap...</span></div>';
    } else if (state === 'idle') {
        bar.innerHTML = '<div class="mic-dot"></div><span class="mic-text">Menunggu...</span>';
    } else if (state === 'error') {
        bar.innerHTML = '<div class="mic-dot"></div><span class="mic-text">' + esc(customText || 'Ralat') + '</span>';
    }
}

// ===== AUDIO PLAYBACK =====
async function playAudioSequence(matches) {
    isPlaying = true;
    pauseMic();
    setMicState('playing');
    for (const m of matches) {
        if (m.audio_exists !== false) {
            try { await playSingleAudio(m.audio_path); } catch(e) {}
        }
    }
    isPlaying = false;
    resumeMic();
}

function playSingleAudio(path) {
    return new Promise((resolve, reject) => {
        if (currentAudio) { currentAudio.pause(); currentAudio = null; }
        const audio = new Audio(path);
        currentAudio = audio;
        audio.onended = () => { currentAudio = null; resolve(); };
        audio.onerror = () => { currentAudio = null; reject(); };
        audio.play().catch(reject);
    });
}

// ===== CHAT UI =====
function addMessage(type, text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ' + type;
    if (type === 'ai') {
        div.innerHTML = '<div class="ic">A</div><div class="bbl">' + esc(text) + '</div>';
    } else {
        div.innerHTML = '<div class="bbl">' + esc(text) + '</div>';
    }
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function showTyping() {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.id = 'typingDots';
    div.innerHTML = '<div class="ic">A</div><div class="bbl"><div class="dots"><span></span><span></span><span></span></div></div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingDots');
    if (el) el.remove();
}

function esc(s) {
    const d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
}

// ===== PROCESS MESSAGE =====
async function processMessage(text) {
    addMessage('user', text);
    showTyping();
    console.log('[VOICE] Processing:', text, '| Current order:', JSON.stringify(order));

    try {
        const res = await fetch('/api/voice/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, order: order })
        });
        const data = await res.json();
        hideTyping();
        console.log('[VOICE] Engine response:', data.action, data);

        addMessage('ai', data.text);

        // Handle disambiguation — show clickable buttons
        if (data.action === 'disambiguate' && data.disambiguate) {
            // Add any clear (non-ambiguous) items that were included
            if (data.new_items && data.new_items.length) {
                order = data.order || order;
                updateOrderPanel();
            }
            showDisambiguationButtons(data.disambiguate);
            // Play audio only for clear items (no audio for disambiguation)
            if (data.has_audio && data.audio_matches && data.audio_matches.length) {
                await playAudioSequence(data.audio_matches);
            } else {
                resumeMic();
            }
            return;
        }

        // Handle add_items — update order + show panel
        if (data.action === 'add_items' && data.new_items && data.new_items.length) {
            order = data.order || order;
            updateOrderPanel();
            showOrderPanel();

            // Show text-only add-on suggestion (no audio)
            if (data.text_suggestion) {
                addTextSuggestion(data.text_suggestion);
            }
        }

        // Handle confirm_order — show order panel, DON'T auto-submit
        if (data.action === 'confirm_order' && order.length > 0) {
            order = data.order || order;
            updateOrderPanel();
            showOrderPanel();
        }

        // Play audio response (item names + "Ada lagi?" only)
        if (data.has_audio && data.audio_matches && data.audio_matches.length) {
            await playAudioSequence(data.audio_matches);
        } else {
            resumeMic();
        }

    } catch(e) {
        hideTyping();
        addMessage('ai', 'Maaf, ada masalah. Cuba lagi.');
        resumeMic();
    }
}

// ===== DISAMBIGUATION UI =====
function showDisambiguationButtons(disambiguateData) {
    const chat = document.getElementById('chat');
    disambiguateData.forEach(group => {
        const div = document.createElement('div');
        div.className = 'msg ai';
        div.style.maxWidth = '92%';

        const ic = document.createElement('div');
        ic.className = 'ic';
        ic.textContent = 'A';
        div.appendChild(ic);

        const wrap = document.createElement('div');
        wrap.className = 'disambig-wrap';

        group.options.forEach(opt => {
            const btn = document.createElement('button');
            btn.className = 'disambig-btn';
            btn.innerHTML = esc(opt.name) + ' <span class="disambig-price">RM' + opt.price.toFixed(2) + '</span>';
            btn.addEventListener('click', () => {
                // Remove all disambiguation buttons
                document.querySelectorAll('.disambig-wrap').forEach(el => {
                    const parent = el.closest('.msg');
                    if (parent) parent.remove();
                });
                // Process the selected item directly
                const qty = group.qty || 1;
                const itemText = qty > 1 ? qty + ' ' + opt.name.toLowerCase() : opt.name.toLowerCase();
                processMessage(itemText);
            });
            wrap.appendChild(btn);
        });

        div.appendChild(wrap);
        chat.appendChild(div);
    });
    chat.scrollTop = chat.scrollHeight;
}

// ===== TEXT SUGGESTION (no audio) =====
function addTextSuggestion(text) {
    const chat = document.getElementById('chat');
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.style.animation = 'msgIn .3s ease';
    div.innerHTML = '<div class="ic" style="visibility:hidden">A</div><div class="suggestion-bubble">' + esc(text) + '</div>';
    chat.appendChild(div);
    chat.scrollTop = chat.scrollHeight;
}

// ===== ORDER PANEL =====
function updateOrderPanel() {
    const listEl = document.getElementById('orderList');
    const countEl = document.getElementById('orderCount');
    const totalEl = document.getElementById('orderTotal');
    listEl.innerHTML = '';

    let total = 0;
    let count = 0;

    order.forEach(item => {
        const qty = item.qty || 1;
        const price = (item.price || 0) * qty;
        total += price;
        count += qty;

        const row = document.createElement('div');
        row.className = 'order-row';
        row.innerHTML =
            '<div class="qty">' + qty + '</div>' +
            '<div class="nm">' + esc(item.name) + '</div>' +
            '<div class="pr">RM ' + price.toFixed(2) + '</div>';
        listEl.appendChild(row);
    });

    countEl.textContent = count;
    totalEl.textContent = 'RM ' + total.toFixed(2);
}

function showOrderPanel() {
    if (panelOpen) return;
    panelOpen = true;
    document.getElementById('orderPanel').classList.add('show');
}

function hideOrderPanel() {
    panelOpen = false;
    document.getElementById('orderPanel').classList.remove('show');
}

function addMore() {
    hideOrderPanel();
    if (!shouldListen) resumeMic();
}

async function sendOrderToTelegram() {
    hideOrderPanel();
    pauseMic();

    const items = order.map(i => ({
        name: i.name,
        qty: i.qty || 1,
        quantity: i.qty || 1,
        price: i.price || 0
    }));
    const total = items.reduce((s, i) => s + i.price * i.quantity, 0);

    const payload = {
        table_number: TABLE,
        items: items,
        total: total
    };
    console.log('[VOICE] Submitting order to Telegram:', JSON.stringify(payload));

    try {
        const res = await fetch('/api/voice/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        console.log('[VOICE] Order response:', res.status, data);

        if (!res.ok || data.success === false) {
            console.error('[VOICE] Order failed:', data.error || res.statusText);
            addMessage('ai', 'Maaf, ada masalah hantar order. Cuba lagi.');
            showOrderPanel();
            resumeMic();
            return;
        }

        // Show success overlay
        document.getElementById('successOverlay').classList.add('show');
        console.log('[VOICE] Order sent successfully!');

        // Play thank you audio
        try { await playSingleAudio('/audio/wavs/0021.wav'); } catch(e) {}

        // Reset after 5 seconds — DO NOT reset earlier
        setTimeout(() => {
            document.getElementById('successOverlay').classList.remove('show');
            order = [];
            panelOpen = false;
            updateOrderPanel();
            addMessage('ai', 'Pesanan baru? Saya sedia membantu!');
            resumeMic();
        }, 5000);
    } catch(e) {
        console.error('[VOICE] Order fetch error:', e);
        addMessage('ai', 'Maaf, ada masalah hantar order. Cuba lagi.');
        showOrderPanel();
        resumeMic();
    }
}

async function submitOrder() {
    if (!order.length) return;
    await sendOrderToTelegram();
}
</script>
