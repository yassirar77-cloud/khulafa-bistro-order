<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Aisha – Khulafa Bistro</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --gold:#D4A843; --gold-light:#F0C96A; --gold-dark:#A07828;
  --green:#1A6B3C; --cream:#FDF6E9; --dark:#0F1A0F; --text:#2C1A0E;
}
html,body { height:100%; background:var(--dark); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; }

/* SPLASH */
#splash {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(160deg,#0F2A1A 0%,#0A1A0F 50%,#1A0F05 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  transition:opacity 0.6s ease, transform 0.6s ease;
}
#splash.hide { opacity:0; transform:scale(1.05); pointer-events:none; }
.splash-logo {
  width:120px; height:120px; border-radius:30px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:28px;
  box-shadow:0 20px 60px rgba(212,168,67,0.4);
  animation:floatLogo 3s ease-in-out infinite;
}
@keyframes floatLogo { 0%,100%{transform:translateY(0);} 50%{transform:translateY(-8px);} }
.splash-title { font-size:38px; font-weight:800; color:var(--gold); letter-spacing:-1px; margin-bottom:6px; }
.splash-sub { font-size:15px; color:rgba(255,255,255,0.5); letter-spacing:3px; text-transform:uppercase; margin-bottom:60px; }
.splash-btn {
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  color:var(--dark); border:none; padding:18px 52px; border-radius:50px;
  font-size:18px; font-weight:700; cursor:pointer;
  box-shadow:0 8px 30px rgba(212,168,67,0.5); transition:transform 0.15s;
}
.splash-btn:active { transform:scale(0.96); }
.splash-table { margin-top:20px; font-size:14px; color:rgba(255,255,255,0.35); letter-spacing:1px; }

/* APP */
#app { height:100%; display:flex; flex-direction:column; background:linear-gradient(180deg,#0A1A0F 0%,#0F1505 100%); }

/* HEADER */
.header {
  padding:16px 20px 12px; display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(212,168,67,0.15); flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:12px; }
.aisha-avatar {
  width:44px; height:44px; border-radius:14px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:22px;
  box-shadow:0 4px 15px rgba(212,168,67,0.3);
}
.aisha-info h2 { font-size:17px; font-weight:700; color:var(--gold); }
.aisha-status { font-size:12px; color:#4CAF50; display:flex; align-items:center; gap:5px; }
.status-dot { width:7px; height:7px; border-radius:50%; background:#4CAF50; animation:pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.4;} }
.table-badge {
  background:rgba(212,168,67,0.15); border:1px solid rgba(212,168,67,0.3);
  color:var(--gold); padding:6px 14px; border-radius:20px; font-size:13px; font-weight:600;
}

/* CHAT */
.chat-area {
  flex:1; overflow-y:auto; padding:20px 16px;
  display:flex; flex-direction:column; gap:14px; scroll-behavior:smooth;
}
.chat-area::-webkit-scrollbar { width:3px; }
.chat-area::-webkit-scrollbar-thumb { background:rgba(212,168,67,0.3); border-radius:2px; }
.msg { display:flex; gap:10px; max-width:88%; animation:msgIn 0.3s ease; }
@keyframes msgIn { from{opacity:0;transform:translateY(12px);} to{opacity:1;transform:translateY(0);} }
.msg.ai { align-self:flex-start; }
.msg.user { align-self:flex-end; flex-direction:row-reverse; }
.msg-avatar {
  width:32px; height:32px; border-radius:10px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:2px;
}
.msg-bubble { padding:12px 16px; border-radius:18px; font-size:15px; line-height:1.5; }
.msg.ai .msg-bubble { background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.92); border-top-left-radius:4px; }
.msg.user .msg-bubble { background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%); color:var(--dark); font-weight:500; border-top-right-radius:4px; }
.typing-bubble { background:rgba(255,255,255,0.08); padding:14px 18px; border-radius:18px; border-top-left-radius:4px; display:flex; gap:5px; align-items:center; }
.typing-dot { width:8px; height:8px; border-radius:50%; background:var(--gold); opacity:0.6; animation:typingBounce 1.2s infinite; }
.typing-dot:nth-child(2){animation-delay:0.2s;} .typing-dot:nth-child(3){animation-delay:0.4s;}
@keyframes typingBounce { 0%,100%{transform:translateY(0);opacity:0.4;} 50%{transform:translateY(-5px);opacity:1;} }

/* ORDER CARD */
.order-card {
  background:rgba(212,168,67,0.08); border:1px solid rgba(212,168,67,0.25);
  border-radius:16px; padding:14px 16px; margin:4px 0; animation:msgIn 0.3s ease;
}
.order-card-title { font-size:12px; color:var(--gold); letter-spacing:1.5px; text-transform:uppercase; font-weight:700; margin-bottom:10px; }
.order-item { display:flex; justify-content:space-between; align-items:center; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.06); }
.order-item:last-of-type { border-bottom:none; }
.order-item-name { color:rgba(255,255,255,0.85); font-size:14px; }
.order-item-qty { background:rgba(212,168,67,0.2); color:var(--gold); padding:2px 8px; border-radius:8px; font-size:12px; font-weight:700; margin-right:8px; }
.order-item-price { color:var(--gold); font-size:14px; font-weight:600; }
.order-total { display:flex; justify-content:space-between; padding-top:10px; margin-top:6px; border-top:1px solid rgba(212,168,67,0.3); }
.order-total-label { color:rgba(255,255,255,0.6); font-size:13px; }
.order-total-amount { color:var(--gold); font-size:18px; font-weight:800; }
.order-actions { display:flex; gap:8px; margin-top:12px; }
.btn-confirm { flex:1; padding:12px; background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%); color:var(--dark); border:none; border-radius:12px; font-size:15px; font-weight:700; cursor:pointer; transition:opacity 0.15s,transform 0.15s; }
.btn-confirm:active { opacity:0.85; transform:scale(0.97); }
.btn-add { padding:12px 16px; background:rgba(255,255,255,0.08); color:rgba(255,255,255,0.7); border:1px solid rgba(255,255,255,0.15); border-radius:12px; font-size:15px; cursor:pointer; }

/* DISAMBIGUATION BUTTONS */
.disambig-wrap { display:flex; flex-direction:column; gap:6px; padding:4px 0; }
.disambig-btn {
  display:block; width:100%; text-align:left;
  padding:10px 14px; border:1px solid rgba(212,168,67,0.3); border-radius:12px;
  background:rgba(212,168,67,0.08); color:rgba(255,255,255,0.9); font-size:14px; font-weight:500;
  font-family:inherit; cursor:pointer; transition:background 0.15s, border-color 0.15s;
}
.disambig-btn:active { background:rgba(212,168,67,0.2); border-color:var(--gold); }
.disambig-price { color:var(--gold); font-weight:600; float:right; }

/* MIC */
.mic-section { flex-shrink:0; padding:16px 20px 28px; background:rgba(0,0,0,0.4); border-top:1px solid rgba(212,168,67,0.1); display:flex; flex-direction:column; align-items:center; gap:14px; }
.waveform { height:36px; display:flex; align-items:center; gap:3px; opacity:0; transition:opacity 0.3s; }
.waveform.active { opacity:1; }
.wave-bar { width:4px; background:var(--gold); border-radius:2px; animation:waveBounce 0.8s ease-in-out infinite; }
.wave-bar:nth-child(1){height:8px;animation-delay:0s;} .wave-bar:nth-child(2){height:20px;animation-delay:0.1s;}
.wave-bar:nth-child(3){height:30px;animation-delay:0.2s;} .wave-bar:nth-child(4){height:24px;animation-delay:0.3s;}
.wave-bar:nth-child(5){height:36px;animation-delay:0.15s;} .wave-bar:nth-child(6){height:28px;animation-delay:0.25s;}
.wave-bar:nth-child(7){height:18px;animation-delay:0.35s;} .wave-bar:nth-child(8){height:10px;animation-delay:0.05s;}
@keyframes waveBounce { 0%,100%{transform:scaleY(0.4);opacity:0.5;} 50%{transform:scaleY(1);opacity:1;} }
.mic-ring { position:relative; width:80px; height:80px; display:flex; align-items:center; justify-content:center; }
.mic-ring-pulse { position:absolute; inset:-8px; border-radius:50%; border:2px solid var(--gold); opacity:0; }
.mic-ring-pulse.listening { animation:ringPulse 1.5s ease-out infinite; }
@keyframes ringPulse { 0%{opacity:0.8;transform:scale(1);} 100%{opacity:0;transform:scale(1.5);} }
.mic-btn {
  width:80px; height:80px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  border:none; cursor:pointer; font-size:32px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 8px 30px rgba(212,168,67,0.5);
  transition:transform 0.15s, box-shadow 0.15s; position:relative; z-index:1;
}
.mic-btn:active { transform:scale(0.92); }
.mic-btn.listening { background:linear-gradient(135deg,#E53935 0%,#B71C1C 100%); box-shadow:0 8px 30px rgba(229,57,53,0.5); }
.mic-btn.processing { background:linear-gradient(135deg,#1565C0 0%,#0D47A1 100%); box-shadow:0 8px 30px rgba(21,101,192,0.5); }
.mic-label { font-size:13px; color:rgba(255,255,255,0.45); letter-spacing:0.5px; text-align:center; }

/* ORDER SENT */
#orderSent {
  position:fixed; inset:0; z-index:200;
  background:linear-gradient(160deg,#0A2A15 0%,#051A08 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.5s ease;
}
#orderSent.show { opacity:1; pointer-events:all; }
.success-ring { width:140px; height:140px; border-radius:50%; border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:64px; margin-bottom:28px; animation:successPop 0.5s cubic-bezier(0.175,0.885,0.32,1.275); box-shadow:0 0 60px rgba(212,168,67,0.3); }
@keyframes successPop { from{transform:scale(0);opacity:0;} to{transform:scale(1);opacity:1;} }
.success-title { font-size:32px; font-weight:800; color:var(--gold); margin-bottom:10px; }
.success-sub { font-size:16px; color:rgba(255,255,255,0.5); margin-bottom:40px; text-align:center; padding:0 20px; }
.success-table { background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.3); padding:12px 28px; border-radius:12px; color:var(--gold); font-size:15px; font-weight:600; }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">🍽️</div>
  <div class="splash-title">Khulafa Bistro</div>
  <div class="splash-sub">AI Voice Ordering</div>
  <button class="splash-btn" onclick="startSession()">🎤 Mula Order</button>
  <div class="splash-table" id="splashTable">Memuatkan...</div>
</div>

<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="aisha-avatar">👩</div>
      <div class="aisha-info">
        <h2>Aisha</h2>
        <div class="aisha-status">
          <div class="status-dot"></div>
          <span id="statusText">Bersedia</span>
        </div>
      </div>
    </div>
    <div class="table-badge" id="tableBadge">—</div>
  </div>
  <div class="chat-area" id="chatArea"></div>
  <div class="mic-section">
    <div class="waveform" id="waveform">
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
      <div class="wave-bar"></div><div class="wave-bar"></div>
    </div>
    <div class="mic-ring">
      <div class="mic-ring-pulse" id="micRingPulse"></div>
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
    </div>
    <div class="mic-label" id="micLabel">Tekan untuk bercakap dengan Aisha</div>
  </div>
</div>

<div id="orderSent">
  <div class="success-ring">✓</div>
  <div class="success-title">Order Dihantar!</div>
  <div class="success-sub">Makanan sedang disediakan.<br>Terima kasih kerana makan di Khulafa!</div>
  <div class="success-table" id="successTable">Table —</div>
</div>

<script>
// ===== CONFIG =====
const TABLE = new URLSearchParams(location.search).get('table')
    || location.pathname.split('/').filter(Boolean).pop() || 'T01';

// ===== STATE =====
let shouldListen = false;
let isPlaying = false;
let isProcessing = false;
let currentAudio = null;
let order = [];          // [{name, qty, price}, ...]

document.getElementById('splashTable').textContent = 'Table ' + TABLE;
document.getElementById('tableBadge').textContent = 'Table ' + TABLE;
document.getElementById('successTable').textContent = 'Table ' + TABLE;

// ===== START SESSION =====
function startSession() {
  document.getElementById('splash').classList.add('hide');
  setTimeout(() => { document.getElementById('splash').style.display='none'; initChat(); }, 600);
}

async function initChat() {
  setStatus('Menghubungi Aisha...');
  addTypingIndicator();
  initSpeechRecognition();

  try {
    const res = await fetch('/api/voice/greeting');
    removeTypingIndicator();
    if (res.ok) {
      const data = await res.json();
      const txt = data.text || 'Selamat datang ke Khulafa Bistro! Saya Aisha. Nak order apa hari ni?';
      addAiMsg(txt);
      if (data.has_audio && data.audio_matches && data.audio_matches.length) {
        isPlaying = true;
        setStatus('Aisha bercakap...');
        await playAudioSequence(data.audio_matches);
        isPlaying = false;
      }
    } else throw new Error();
  } catch(e) {
    removeTypingIndicator();
    addAiMsg('Selamat datang ke Khulafa Bistro! Saya Aisha, pelayan AI anda. Nak order apa hari ni?');
  }

  setStatus('Bersedia');
  // Whisper mode: wait for user to tap mic button (push-to-talk)
}

// ===== WHISPER SPEECH-TO-TEXT (via MediaRecorder + Server API) =====
let mediaRecorder = null;
let audioChunks = [];
let audioStream = null;

function initSpeechRecognition() {
  // Whisper-based: no browser SpeechRecognition needed
  // MediaRecorder will be initialized on first mic use
  console.log('[VOICE] Using OpenAI Whisper API for speech-to-text');
}

async function startRecording() {
  try {
    audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
    audioChunks = [];
    mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm;codecs=opus' });

    mediaRecorder.ondataavailable = (e) => {
      if (e.data.size > 0) audioChunks.push(e.data);
    };

    mediaRecorder.onstop = async () => {
      // Stop all tracks to release microphone
      if (audioStream) { audioStream.getTracks().forEach(t => t.stop()); audioStream = null; }

      if (audioChunks.length === 0) {
        setMicState('idle');
        setStatus('Bersedia');
        return;
      }

      const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
      audioChunks = [];

      // Send to Whisper API for transcription
      setMicState('processing');
      setStatus('Mengecam suara...');

      try {
        const formData = new FormData();
        formData.append('file', audioBlob, 'recording.webm');

        const res = await fetch('/api/voice/transcribe', {
          method: 'POST',
          body: formData
        });

        if (!res.ok) throw new Error('Transcription failed');
        const data = await res.json();
        const text = (data.text || '').trim();

        if (text) {
          console.log('[VOICE] Whisper transcript:', text);
          processMessage(text, [{ text: text, confidence: 1.0 }]);
        } else {
          setMicState('idle');
          setStatus('Bersedia');
          addSystemMsg('Maaf, tidak dapat mengesan suara. Cuba lagi.');
        }
      } catch (e) {
        console.error('[VOICE] Whisper transcription error:', e);
        setMicState('idle');
        setStatus('Bersedia');
        addSystemMsg('Maaf, masalah mengecam suara. Cuba lagi.');
      }
    };

    mediaRecorder.start();
    setMicState('listening');
    setStatus('Mendengar...');
    shouldListen = true;
    console.log('[VOICE] Recording started');
  } catch (e) {
    console.error('[VOICE] Mic permission denied:', e);
    setStatus('Sila benarkan mikrofon di tetapan pelayar');
  }
}

function stopRecording() {
  if (mediaRecorder && mediaRecorder.state === 'recording') {
    mediaRecorder.stop();
    console.log('[VOICE] Recording stopped');
  }
  shouldListen = false;
}

function toggleMic() {
  if (isProcessing || isPlaying) return;
  if (shouldListen && mediaRecorder && mediaRecorder.state === 'recording') {
    stopRecording();
  } else {
    startRecording();
  }
}

function restartMic() {
  // No-op for Whisper mode — user manually taps to record
}

function pauseMic() {
  stopRecording();
  setMicState('processing');
}

function resumeMic() {
  // In Whisper mode, don't auto-start recording — wait for user tap
  shouldListen = false;
  setMicState('idle');
  setStatus('Bersedia');
}

function showMicRecovery() {
  shouldListen = false;
  setMicState('idle');
  setStatus('Tekan butang untuk cuba semula');
  console.log('[VOICE] Mic recovery mode — waiting for user tap');
}

async function restartListening() {
  setMicState('idle');
  setStatus('Bersedia');
}

// ===== PROCESS MESSAGE =====
async function processMessage(text, alternatives) {
  if (!text || text.length < 2) return;
  isProcessing = true;
  setMicState('processing');
  setStatus('Memproses...');
  addUserMsg(text);
  addTypingIndicator();

  try {
    const payload = {
      message: text,
      alternatives: alternatives || [],
      order: order,
      table_number: TABLE
    };

    const res = await fetch('/api/voice/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    removeTypingIndicator();
    const data = await res.json();
    console.log('[VOICE] Engine response:', data.action, data);

    const reply = data.text || 'Maaf, boleh ulang?';
    addAiMsg(reply);

    const ttsNames = data.tts_names || [];

    // Handle disambiguation — show clickable buttons
    if (data.action === 'disambiguate' && data.disambiguate) {
      if (data.new_items && data.new_items.length) {
        order = data.order || order;
      }
      showDisambiguationButtons(data.disambiguate);
      if (data.has_audio && data.audio_matches && data.audio_matches.length) {
        await playAudioSequence(data.audio_matches, ttsNames);
      } else {
        isProcessing = false;
        resumeMic();
      }
      return;
    }

    // Handle add_items — update order + show order card
    if (data.action === 'add_items' && data.new_items && data.new_items.length) {
      order = data.order || order;
      showOrderCard(order, data.total);
    }

    // Handle confirm_order — submit to Telegram
    if ((data.action === 'confirm_order' || data.action === 'confirm') && order.length > 0) {
      order = data.order || order;

      const orderItems = order.map(i => ({
        name: i.name,
        qty: i.qty || 1,
        price: i.price || 0
      }));
      const orderTotal = orderItems.reduce((s, i) => s + i.price * i.qty, 0);

      try {
        const orderRes = await fetch('/api/voice/order', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            table_number: TABLE,
            items: orderItems,
            total: orderTotal
          })
        });
        const orderData = await orderRes.json();

        if (orderData.status === 'sent') {
          showOrderSent();
          try { await playSingleAudio('/audio/wavs/0021.wav'); } catch(e) {}
          setTimeout(() => {
            document.getElementById('orderSent').classList.remove('show');
            order = [];
            addAiMsg('Ada pesanan lain? Saya sedia membantu.');
            isProcessing = false;
            resumeMic();
          }, 5000);
          return;
        } else {
          addAiMsg('Maaf, terdapat masalah menghantar pesanan. Sila cuba sekali lagi.');
        }
      } catch(orderErr) {
        console.error('[VOICE] Order fetch error:', orderErr);
        addAiMsg('Maaf, terdapat masalah menghantar pesanan. Sila cuba sekali lagi.');
      }
    }

    // Play audio response
    if (data.has_audio && data.audio_matches && data.audio_matches.length) {
      isPlaying = true;
      setStatus('Aisha bercakap...');
      await playAudioSequence(data.audio_matches, ttsNames);
      isPlaying = false;
    } else if (ttsNames && ttsNames.length > 0) {
      isPlaying = true;
      setStatus('Aisha bercakap...');
      await playAudioSequence([], ttsNames);
      isPlaying = false;
    }

  } catch(e) {
    removeTypingIndicator();
    addAiMsg('Maaf, ada masalah teknikal. Cuba lagi ya.');
  }

  isProcessing = false;
  setMicState('idle');
  setStatus('Bersedia');
  setTimeout(() => { if (!shouldListen && !isProcessing && !isPlaying) resumeMic(); }, 800);
}

// ===== CONFIRM / ADD MORE =====
async function confirmOrder() {
  document.querySelectorAll('.order-card').forEach(c => c.remove());
  pauseMic();
  await processMessage('confirm pesanan', []);
}

function addMore() {
  document.querySelectorAll('.order-card').forEach(c => c.remove());
  addAiMsg('Okay, nak tambah apa lagi?');
  isProcessing = false;
  setTimeout(() => resumeMic(), 500);
}

function showOrderSent() {
  document.querySelectorAll('.order-card').forEach(c => c.remove());
  document.getElementById('orderSent').classList.add('show');
}

// ===== DISAMBIGUATION UI =====
function showDisambiguationButtons(disambiguateData) {
  const chatArea = document.getElementById('chatArea');
  disambiguateData.forEach(group => {
    const div = document.createElement('div');
    div.className = 'msg ai';
    div.style.maxWidth = '92%';

    const ic = document.createElement('div');
    ic.className = 'msg-avatar';
    ic.textContent = '👩';
    div.appendChild(ic);

    const wrap = document.createElement('div');
    wrap.className = 'disambig-wrap';

    group.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'disambig-btn';
      btn.innerHTML = esc(opt.name) + ' <span class="disambig-price">RM' + opt.price.toFixed(2) + '</span>';
      btn.addEventListener('click', () => {
        document.querySelectorAll('.disambig-wrap').forEach(el => {
          const parent = el.closest('.msg');
          if (parent) parent.remove();
        });
        const qty = group.qty || 1;
        const itemText = qty > 1 ? qty + ' ' + opt.name.toLowerCase() : opt.name.toLowerCase();
        processMessage(itemText, []);
      });
      wrap.appendChild(btn);
    });

    div.appendChild(wrap);
    chatArea.appendChild(div);
  });
  scrollBottom();
}

// ===== AUDIO PLAYBACK =====
async function playAudioSequence(matches, ttsNames) {
  isPlaying = true;
  setStatus('Aisha bercakap...');
  document.getElementById('waveform').classList.add('active');

  // Play TTS for items without pre-recorded audio
  if (ttsNames && ttsNames.length > 0) {
    for (const name of ttsNames) {
      try { await speakTTS(name); } catch(e) { console.warn('[TTS] Error:', e); }
    }
  }

  // Play pre-recorded audio files
  for (const m of matches) {
    const audioPath = m.audio_path || m.file || m.audio_file || m;
    if (audioPath && m.audio_exists !== false) {
      try { await playSingleAudio(audioPath); } catch(e) {}
    }
  }

  document.getElementById('waveform').classList.remove('active');
  isPlaying = false;
  setStatus('Bersedia');
}

function playSingleAudio(url) {
  return new Promise(resolve => {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }
    const a = new Audio(url);
    currentAudio = a;
    a.onended = () => { currentAudio = null; resolve(); };
    a.onerror = () => { currentAudio = null; resolve(); };
    a.play().catch(resolve);
  });
}

function speakTTS(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) { resolve(); return; }
    const utt = new SpeechSynthesisUtterance(text);
    utt.lang = 'ms-MY';
    utt.rate = 1;
    utt.onend = resolve;
    utt.onerror = resolve;
    window.speechSynthesis.speak(utt);
  });
}

function showOrderCard(items, total) {
  // Remove existing order cards
  document.querySelectorAll('.order-card').forEach(c => c.remove());

  const tv = total || items.reduce((s, i) => s + (i.price * (i.qty || 1)), 0);
  const ih = items.map(i =>
    '<div class="order-item">' +
    '<div style="display:flex;align-items:center;gap:6px;">' +
    '<span class="order-item-qty">' + (i.qty || 1) + 'x</span>' +
    '<span class="order-item-name">' + esc(i.name) + '</span>' +
    '</div>' +
    '<span class="order-item-price">RM' + ((i.price || 0) * (i.qty || 1)).toFixed(2) + '</span>' +
    '</div>'
  ).join('');

  const e = document.createElement('div');
  e.className = 'order-card';
  e.innerHTML =
    '<div class="order-card-title">📋 Pesanan Anda</div>' + ih +
    '<div class="order-total">' +
    '<span class="order-total-label">Jumlah</span>' +
    '<span class="order-total-amount">RM' + tv.toFixed(2) + '</span>' +
    '</div>' +
    '<div class="order-actions">' +
    '<button class="btn-add" onclick="addMore()">+ Tambah</button>' +
    '<button class="btn-confirm" onclick="confirmOrder()">Confirm Order ✓</button>' +
    '</div>';
  document.getElementById('chatArea').appendChild(e);
  scrollBottom();
}

// ===== MIC STATE =====
function setMicState(s) {
  const b = document.getElementById('micBtn');
  const p = document.getElementById('micRingPulse');
  const l = document.getElementById('micLabel');
  const w = document.getElementById('waveform');

  b.className = 'mic-btn';
  p.className = 'mic-ring-pulse';

  if (s === 'listening') {
    b.classList.add('listening');
    b.textContent = '🔴';
    p.classList.add('listening');
    w.classList.add('active');
    l.textContent = 'Sedang mendengar... (tekan untuk berhenti)';
  } else if (s === 'processing') {
    b.classList.add('processing');
    b.textContent = '⏳';
    w.classList.remove('active');
    l.textContent = 'Aisha sedang berfikir...';
  } else {
    b.textContent = '🎤';
    w.classList.remove('active');
    l.textContent = 'Tekan untuk bercakap dengan Aisha';
  }
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }
function scrollBottom() { const a = document.getElementById('chatArea'); setTimeout(() => a.scrollTop = a.scrollHeight, 50); }
function esc(t) { return t.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
