<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aisha - Voice Order</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #0a0a0a;
            color: #fff;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            padding: 12px 16px;
            background: #111;
            border-bottom: 1px solid #222;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .header .table-badge {
            background: #f59e0b;
            color: #000;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
        }
        
        /* Chat Area */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .message {
            max-width: 85%;
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 15px;
            line-height: 1.4;
            animation: fadeIn 0.3s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .message.ai {
            background: #1a1a2e;
            border: 1px solid #2a2a4e;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        
        .message.ai .speaker-icon {
            display: inline-block;
            margin-left: 6px;
            cursor: pointer;
            opacity: 0.6;
            font-size: 14px;
        }
        .message.ai .speaker-icon:hover { opacity: 1; }
        .message.ai .speaker-icon.playing { opacity: 1; color: #f59e0b; }
        
        .message.user {
            background: #1e3a2f;
            border: 1px solid #2e5a3f;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }
        
        .message.system {
            background: #1a1a1a;
            border: 1px solid #333;
            align-self: center;
            font-size: 13px;
            color: #888;
            text-align: center;
        }
        
        /* Mic Button Area */
        .mic-area {
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            background: #111;
            border-top: 1px solid #222;
        }
        
        .mic-btn {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            border: 3px solid #333;
            background: #1a1a1a;
            color: #fff;
            font-size: 28px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        
        .mic-btn:active { transform: scale(0.95); }
        .mic-btn.listening {
            border-color: #ef4444;
            background: #2a1a1a;
            animation: pulse 1.5s infinite;
        }
        .mic-btn.processing {
            border-color: #f59e0b;
            background: #2a2a1a;
        }
        .mic-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        
        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            50% { box-shadow: 0 0 0 12px rgba(239, 68, 68, 0); }
        }
        
        .mic-status {
            font-size: 13px;
            color: #666;
            height: 18px;
        }
        .mic-status.active { color: #ef4444; }
        
        /* Audio playing indicator */
        .audio-indicator {
            display: none;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #f59e0b;
        }
        .audio-indicator.visible { display: flex; }
        .audio-bars {
            display: flex;
            gap: 2px;
            height: 16px;
            align-items: end;
        }
        .audio-bars span {
            width: 3px;
            background: #f59e0b;
            border-radius: 1px;
            animation: barBounce 0.8s ease infinite;
        }
        .audio-bars span:nth-child(1) { height: 6px; animation-delay: 0s; }
        .audio-bars span:nth-child(2) { height: 12px; animation-delay: 0.15s; }
        .audio-bars span:nth-child(3) { height: 8px; animation-delay: 0.3s; }
        .audio-bars span:nth-child(4) { height: 14px; animation-delay: 0.45s; }
        
        @keyframes barBounce {
            0%, 100% { transform: scaleY(0.5); }
            50% { transform: scaleY(1.2); }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🎤 Aisha</h1>
        <span class="table-badge" id="tableBadge">Table --</span>
    </div>
    
    <div class="chat-area" id="chatArea">
        <!-- Messages appear here -->
    </div>
    
    <div class="mic-area">
        <div class="audio-indicator" id="audioIndicator">
            <div class="audio-bars"><span></span><span></span><span></span><span></span></div>
            <span>Aisha bercakap...</span>
        </div>
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        <div class="mic-status" id="micStatus">Tekan untuk bercakap</div>
    </div>

    <script>
        // === CONFIG ===
        const tableNumber = window.location.pathname.split('/').pop() || 'T01';
        document.getElementById('tableBadge').textContent = `Table ${tableNumber}`;
        
        let conversationHistory = [];
        let isListening = false;
        let isProcessing = false;
        let recognition = null;
        let currentAudio = null;
        
        // === AUDIO PLAYBACK ===
        
        async function playAudioMatches(matches) {
            """Play a sequence of audio matches one after another."""
            const indicator = document.getElementById('audioIndicator');
            indicator.classList.add('visible');
            
            for (const match of matches) {
                if (match.audio_exists !== false) {
                    try {
                        await playAudioFile(match.audio_path);
                    } catch(e) {
                        console.log('Audio playback failed, skipping:', e);
                    }
                }
            }
            
            indicator.classList.remove('visible');
        }
        
        function playAudioFile(path) {
            return new Promise((resolve, reject) => {
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                
                const audio = new Audio(path);
                currentAudio = audio;
                
                audio.onended = () => {
                    currentAudio = null;
                    resolve();
                };
                audio.onerror = () => {
                    currentAudio = null;
                    reject(new Error('Audio failed'));
                };
                
                audio.play().catch(reject);
            });
        }
        
        function stopAudio() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio = null;
            }
            document.getElementById('audioIndicator').classList.remove('visible');
        }
        
        // Fallback: use browser TTS if no audio match
        function speakWithBrowserTTS(text) {
            if ('speechSynthesis' in window) {
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'ms-MY';
                utterance.rate = 0.9;
                speechSynthesis.speak(utterance);
            }
        }
        
        // === SPEECH RECOGNITION ===
        
        function initRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            if (!SpeechRecognition) {
                addMessage('system', 'Browser tidak support Speech Recognition. Sila guna Chrome.');
                return;
            }
            
            recognition = new SpeechRecognition();
            recognition.lang = 'ms-MY';
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.maxAlternatives = 1;
            
            recognition.onresult = (event) => {
                const text = event.results[0][0].transcript;
                handleUserMessage(text);
            };
            
            recognition.onerror = (event) => {
                console.log('Speech error:', event.error);
                if (event.error === 'no-speech') {
                    setMicStatus('Tak dengar. Cuba lagi.', false);
                } else if (event.error === 'not-allowed') {
                    setMicStatus('Sila benarkan akses mikrofon.', false);
                }
                stopListening();
            };
            
            recognition.onend = () => {
                if (isListening) stopListening();
            };
        }
        
        function toggleMic() {
            if (isProcessing) return;
            
            stopAudio(); // Stop any playing audio
            
            if (isListening) {
                stopListening();
            } else {
                startListening();
            }
        }
        
        function startListening() {
            if (!recognition) initRecognition();
            if (!recognition) return;
            
            isListening = true;
            const btn = document.getElementById('micBtn');
            btn.classList.add('listening');
            btn.textContent = '⏹';
            setMicStatus('Saya dengar...', true);
            
            try {
                recognition.start();
            } catch(e) {
                console.log('Recognition start error:', e);
                stopListening();
            }
        }
        
        function stopListening() {
            isListening = false;
            const btn = document.getElementById('micBtn');
            btn.classList.remove('listening');
            btn.textContent = '🎤';
            setMicStatus('Tekan untuk bercakap', false);
            
            try { recognition.stop(); } catch(e) {}
        }
        
        function setMicStatus(text, active) {
            const el = document.getElementById('micStatus');
            el.textContent = text;
            el.className = 'mic-status' + (active ? ' active' : '');
        }
        
        // === CHAT ===
        
        function addMessage(type, text, audioMatches = null) {
            const chatArea = document.getElementById('chatArea');
            const div = document.createElement('div');
            div.className = `message ${type}`;
            
            if (type === 'ai' && audioMatches && audioMatches.length > 0) {
                const speakerBtn = document.createElement('span');
                speakerBtn.className = 'speaker-icon';
                speakerBtn.textContent = '🔊';
                speakerBtn.onclick = () => {
                    speakerBtn.classList.add('playing');
                    playAudioMatches(audioMatches).then(() => {
                        speakerBtn.classList.remove('playing');
                    });
                };
                div.textContent = text + ' ';
                div.appendChild(speakerBtn);
            } else {
                div.textContent = text;
            }
            
            chatArea.appendChild(div);
            chatArea.scrollTop = chatArea.scrollHeight;
        }
        
        async function handleUserMessage(text) {
            // Show user message
            addMessage('user', text);
            conversationHistory.push({ role: 'user', content: text });
            
            // Set processing state
            isProcessing = true;
            const btn = document.getElementById('micBtn');
            btn.classList.add('processing');
            btn.disabled = true;
            setMicStatus('Aisha sedang fikir...', false);
            
            try {
                // Send to API
                const response = await fetch('/api/voice/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: text,
                        history: conversationHistory,
                        table_number: tableNumber
                    })
                });
                
                const data = await response.json();
                
                // Add AI message
                addMessage('ai', data.text, data.audio_matches);
                conversationHistory.push({ role: 'assistant', content: data.text });
                
                // Play audio
                if (data.has_audio && data.audio_matches.length > 0) {
                    await playAudioMatches(data.audio_matches);
                } else {
                    // Fallback to browser TTS
                    speakWithBrowserTTS(data.text);
                }
                
            } catch(err) {
                console.error('Chat error:', err);
                addMessage('system', 'Maaf, ada masalah. Cuba lagi.');
            }
            
            // Reset
            isProcessing = false;
            btn.classList.remove('processing');
            btn.disabled = false;
            setMicStatus('Tekan untuk bercakap', false);
        }
        
        // === INIT ===
        
        async function init() {
            initRecognition();
            
            // Get greeting from server
            try {
                const res = await fetch('/api/voice/greeting');
                const data = await res.json();
                
                addMessage('ai', data.text, data.audio_matches);
                
                if (data.has_audio) {
                    // Small delay then play greeting
                    setTimeout(() => playAudioMatches(data.audio_matches), 500);
                }
            } catch(e) {
                addMessage('ai', 'Hai! Saya Aisha. Nak order apa?');
            }
        }
        
        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
