<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Khulafa Bistro – Pesanan Suara</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root {
  --gold:#D4A843; --gold-light:#F0C96A; --gold-dark:#A07828;
  --green:#1A6B3C; --cream:#FDF6E9; --dark:#0F1A0F; --text:#2C1A0E;
  --red:#E53935;
}
html,body { height:100%; background:var(--dark); font-family:'Segoe UI',system-ui,sans-serif; overflow:hidden; color:#fff; }

/* SPLASH */
#splash {
  position:fixed; inset:0; z-index:100;
  background:linear-gradient(160deg,#0F2A1A 0%,#0A1A0F 50%,#1A0F05 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
}
#splash.hide { opacity:0; transform:scale(1.05); pointer-events:none; transition:opacity 0.3s,transform 0.3s; }
.splash-logo {
  width:100px; height:100px; border-radius:24px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:48px; margin-bottom:24px;
  box-shadow:0 16px 48px rgba(212,168,67,0.4);
}
.splash-title { font-size:32px; font-weight:800; color:var(--gold); margin-bottom:4px; }
.splash-sub { font-size:14px; color:rgba(255,255,255,0.4); letter-spacing:2px; text-transform:uppercase; margin-bottom:48px; }
.splash-btn {
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  color:var(--dark); border:none; padding:16px 48px; border-radius:50px;
  font-size:18px; font-weight:700; cursor:pointer;
  box-shadow:0 8px 24px rgba(212,168,67,0.5);
}
.splash-btn:active { transform:scale(0.96); }
.splash-table { margin-top:16px; font-size:13px; color:rgba(255,255,255,0.3); }

/* APP LAYOUT */
#app { height:100%; display:none; flex-direction:column; background:linear-gradient(180deg,#0A1A0F 0%,#0F1505 100%); }

/* HEADER — minimal */
.header {
  padding:12px 16px; display:flex; align-items:center; justify-content:space-between;
  background:rgba(0,0,0,0.3); border-bottom:1px solid rgba(212,168,67,0.15); flex-shrink:0;
}
.header-left { display:flex; align-items:center; gap:10px; }
.header-logo {
  width:36px; height:36px; border-radius:10px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  display:flex; align-items:center; justify-content:center; font-size:18px;
}
.header h2 { font-size:16px; font-weight:700; color:var(--gold); }
.header-status { font-size:11px; color:#4CAF50; }
.table-badge {
  background:rgba(212,168,67,0.15); border:1px solid rgba(212,168,67,0.3);
  color:var(--gold); padding:5px 12px; border-radius:16px; font-size:12px; font-weight:600;
}

/* ORDER TABLE */
.order-area {
  flex:1; overflow-y:auto; padding:16px;
}
.order-empty {
  text-align:center; padding:60px 20px; color:rgba(255,255,255,0.3); font-size:15px;
}
.order-empty-icon { font-size:48px; margin-bottom:12px; opacity:0.5; }

.order-table { width:100%; border-collapse:collapse; }
.order-table th {
  text-align:left; font-size:11px; color:var(--gold); letter-spacing:1px;
  text-transform:uppercase; padding:8px 4px; border-bottom:1px solid rgba(212,168,67,0.2);
}
.order-table th:last-child { text-align:right; }
.order-table td { padding:10px 4px; border-bottom:1px solid rgba(255,255,255,0.05); font-size:14px; }
.order-table td:last-child { text-align:right; color:var(--gold); font-weight:600; }
.item-name { color:rgba(255,255,255,0.9); }
.item-mods { font-size:11px; color:rgba(255,255,255,0.4); display:block; margin-top:2px; }
.item-qty {
  background:rgba(212,168,67,0.2); color:var(--gold); padding:2px 8px;
  border-radius:6px; font-size:12px; font-weight:700; display:inline-block; min-width:28px; text-align:center;
}
.item-remove {
  background:none; border:none; color:var(--red); font-size:16px; cursor:pointer;
  padding:4px 8px; opacity:0.6;
}
.item-remove:active { opacity:1; }

/* ORDER TOTAL */
.order-total-row td { border-bottom:none; padding-top:12px; }
.order-total-label { font-size:14px; font-weight:700; color:rgba(255,255,255,0.7); }
.order-total-amount { font-size:20px; font-weight:800; color:var(--gold); }

/* SPEED INDICATOR */
.speed-badge {
  display:inline-block; padding:2px 8px; border-radius:8px; font-size:10px; font-weight:600;
  background:rgba(76,175,80,0.2); color:#4CAF50; margin-left:8px;
}

/* BOTTOM BAR */
.bottom-bar {
  flex-shrink:0; padding:12px 16px 24px; background:rgba(0,0,0,0.5);
  border-top:1px solid rgba(212,168,67,0.15);
}
.mic-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.mic-btn {
  width:56px; height:56px; border-radius:50%;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  border:none; cursor:pointer; font-size:24px;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 4px 16px rgba(212,168,67,0.4); flex-shrink:0;
}
.mic-btn:active { transform:scale(0.92); }
.mic-btn.listening { background:linear-gradient(135deg,#4CAF50 0%,#2E7D32 100%); box-shadow:0 4px 16px rgba(76,175,80,0.4); }
.mic-btn.processing { background:linear-gradient(135deg,#1565C0 0%,#0D47A1 100%); box-shadow:0 4px 16px rgba(21,101,192,0.4); }
.mic-info { flex:1; }
.mic-label { font-size:13px; color:rgba(255,255,255,0.5); }
.mic-transcript { font-size:14px; color:rgba(255,255,255,0.8); margin-top:2px; display:none; }
.waveform { height:28px; display:flex; align-items:center; gap:2px; }
.waveform.hidden { display:none; }
.wave-bar { width:3px; background:var(--gold); border-radius:2px; height:4px; }

.btn-hantar {
  width:100%; padding:16px; border:none; border-radius:14px;
  background:linear-gradient(135deg,var(--gold) 0%,var(--gold-dark) 100%);
  color:var(--dark); font-size:17px; font-weight:800; cursor:pointer;
  box-shadow:0 4px 20px rgba(212,168,67,0.4); letter-spacing:0.5px;
}
.btn-hantar:active { transform:scale(0.97); }
.btn-hantar:disabled { opacity:0.3; cursor:not-allowed; }

/* ORDER SENT */
#orderSent {
  position:fixed; inset:0; z-index:200;
  background:linear-gradient(160deg,#0A2A15 0%,#051A08 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity 0.3s;
}
#orderSent.show { opacity:1; pointer-events:all; }
.success-ring { width:120px; height:120px; border-radius:50%; border:4px solid var(--gold); display:flex; align-items:center; justify-content:center; font-size:56px; margin-bottom:24px; box-shadow:0 0 40px rgba(212,168,67,0.3); }
.success-title { font-size:24px; font-weight:800; color:var(--gold); margin-bottom:8px; text-align:center; }
.success-sub { font-size:15px; color:rgba(255,255,255,0.4); text-align:center; margin-bottom:32px; padding:0 20px; }
.success-table { background:rgba(212,168,67,0.1); border:1px solid rgba(212,168,67,0.3); padding:10px 24px; border-radius:10px; color:var(--gold); font-size:14px; font-weight:600; }
</style>
</head>
<body>

<div id="splash">
  <div class="splash-logo">&#127869;</div>
  <div class="splash-title">Khulafa Bistro</div>
  <div class="splash-sub">Pesanan Suara</div>
  <button class="splash-btn" onclick="startSession()">&#127908; Mula Order</button>
  <div class="splash-table" id="splashTable">Memuatkan...</div>
</div>

<div id="app">
  <div class="header">
    <div class="header-left">
      <div class="header-logo">&#127869;</div>
      <div>
        <h2>Khulafa Bistro</h2>
        <div class="header-status" id="statusText">Bersedia</div>
      </div>
    </div>
    <div class="table-badge" id="tableBadge">&mdash;</div>
  </div>

  <div class="order-area" id="orderArea">
    <div class="order-empty" id="orderEmpty">
      <div class="order-empty-icon">&#127908;</div>
      Tekan butang mikrofon dan sebut pesanan anda.<br>
      Contoh: "Dua roti canai, satu teh tarik"
    </div>
    <table class="order-table" id="orderTable" style="display:none;">
      <thead>
        <tr><th>Item</th><th>Qty</th><th>Harga</th><th></th></tr>
      </thead>
      <tbody id="orderBody"></tbody>
      <tfoot>
        <tr class="order-total-row">
          <td class="order-total-label" colspan="2">Jumlah</td>
          <td class="order-total-amount" id="orderTotal" colspan="2">RM0.00</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <div class="bottom-bar">
    <div class="mic-row">
      <button class="mic-btn" id="micBtn" onclick="toggleMic()">&#127908;</button>
      <div class="mic-info">
        <div class="mic-label" id="micLabel">Tekan untuk mula</div>
        <div class="mic-transcript" id="micTranscript"></div>
        <div class="waveform hidden" id="waveform">
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
          <div class="wave-bar"></div><div class="wave-bar"></div>
        </div>
      </div>
    </div>
    <button class="btn-hantar" id="btnHantar" onclick="hantarPesanan()" disabled>HANTAR PESANAN</button>
  </div>
</div>

<div id="orderSent">
  <div class="success-ring">&#9989;</div>
  <div class="success-title">Pesanan Dihantar!</div>
  <div class="success-sub">Terima kasih. Pesanan anda sedang disediakan.</div>
  <div class="success-table" id="successTable">Meja: &mdash;</div>
</div>

<script>
// ===== CONFIG =====
const TABLE = new URLSearchParams(location.search).get('table')
    || location.pathname.split('/').filter(Boolean).pop() || 'T01';
window.TABLE_NUMBER = TABLE;

document.getElementById('splashTable').textContent = 'Meja ' + TABLE;
document.getElementById('tableBadge').textContent = 'Meja ' + TABLE;
document.getElementById('successTable').textContent = 'Meja: ' + TABLE;

// ===== STATE =====
let ears = null;
let earsStarted = false;
let isProcessing = false;
let order = [];
let menuCache = null;

// ===== CACHE MENU ON LOAD =====
(async function() {
  try {
    const res = await fetch('/api/menu/voice');
    if (res.ok) menuCache = await res.json();
  } catch(e) { console.warn('[Menu] Cache failed:', e); }
})();

// ===== ALWAYS-ON AUDIO ENGINE =====
class AlwaysOnEars {
    constructor() {
        this.stream = null;
        this.mediaRecorder = null;
        this.audioContext = null;
        this.analyser = null;
        this.chunks = [];
        this.isCapturing = false;
        this.isSpeechDetected = false;
        this.silenceStart = null;
        this.speechStart = null;
        this.isPaused = false;
        this.SILENCE_THRESHOLD = 15;
        this.SPEECH_THRESHOLD = 20;
        this.SILENCE_DURATION = 1800;
        this.MIN_SPEECH_DURATION = 500;
        this.MAX_SPEECH_DURATION = 30000;
    }

    async init() {
        try {
            this.stream = await navigator.mediaDevices.getUserMedia({
                audio: { sampleRate:16000, channelCount:1, echoCancellation:true, noiseSuppression:true, autoGainControl:true }
            });
            this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = this.audioContext.createMediaStreamSource(this.stream);
            this.analyser = this.audioContext.createAnalyser();
            this.analyser.fftSize = 512;
            this.analyser.smoothingTimeConstant = 0.3;
            source.connect(this.analyser);
            this.startVolumeMonitor();
            this.isCapturing = true;
            return true;
        } catch(e) { return false; }
    }

    startVolumeMonitor() {
        const dataArray = new Uint8Array(this.analyser.frequencyBinCount);
        const check = () => {
            if (!this.isCapturing) return;
            this.analyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < dataArray.length; i++) sum += dataArray[i] * dataArray[i];
            const rms = Math.sqrt(sum / dataArray.length);
            if (window.updateMicLevel) window.updateMicLevel(rms);
            if (this.isPaused) { requestAnimationFrame(check); return; }
            const now = Date.now();
            if (rms > this.SPEECH_THRESHOLD) {
                this.silenceStart = null;
                if (!this.isSpeechDetected) {
                    this.isSpeechDetected = true;
                    this.speechStart = now;
                    this.startRecording();
                    if (window.onSpeechStart) window.onSpeechStart();
                }
            } else if (rms < this.SILENCE_THRESHOLD && this.isSpeechDetected) {
                if (!this.silenceStart) this.silenceStart = now;
                if ((now - this.silenceStart) >= this.SILENCE_DURATION && (now - this.speechStart) >= this.MIN_SPEECH_DURATION) {
                    this.stopRecordingAndTranscribe();
                }
            }
            if (this.isSpeechDetected && this.speechStart && (now - this.speechStart) > this.MAX_SPEECH_DURATION) {
                this.stopRecordingAndTranscribe();
            }
            requestAnimationFrame(check);
        };
        requestAnimationFrame(check);
    }

    startRecording() {
        this.chunks = [];
        this.mediaRecorder = new MediaRecorder(this.stream, {
            mimeType: MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : 'audio/webm'
        });
        this.mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) this.chunks.push(e.data); };
        this.mediaRecorder.start(200);
    }

    async stopRecordingAndTranscribe() {
        this.isSpeechDetected = false;
        this.silenceStart = null;
        this.speechStart = null;
        if (!this.mediaRecorder || this.mediaRecorder.state !== 'recording') return;
        return new Promise((resolve) => {
            this.mediaRecorder.onstop = async () => {
                const audioBlob = new Blob(this.chunks, { type: 'audio/webm' });
                this.chunks = [];
                if (audioBlob.size < 1000) { resolve(); return; }
                if (window.onTranscribing) window.onTranscribing();
                try {
                    const formData = new FormData();
                    formData.append('audio', audioBlob, 'speech.webm');
                    formData.append('table_number', window.TABLE_NUMBER || 'T01');
                    const res = await fetch('/api/voice/transcribe', { method: 'POST', body: formData });
                    if (res.ok) {
                        const data = await res.json();
                        if (data.text && data.text.trim().length > 0) {
                            if (window.onTranscriptionResult) window.onTranscriptionResult(data.text);
                        }
                    }
                } catch(e) { console.error('[Ears] Error:', e); }
                resolve();
            };
            this.mediaRecorder.stop();
        });
    }

    pause() {
        this.isPaused = true;
        if (this.mediaRecorder?.state === 'recording') { this.mediaRecorder.stop(); this.chunks = []; }
        this.isSpeechDetected = false; this.silenceStart = null; this.speechStart = null;
    }
    resume() { this.isPaused = false; }
    destroy() {
        this.isCapturing = false; this.isPaused = true;
        if (this.mediaRecorder?.state === 'recording') this.mediaRecorder.stop();
        if (this.stream) this.stream.getTracks().forEach(t => t.stop());
        if (this.audioContext) this.audioContext.close();
    }
}

// ===== WAVEFORM =====
window.updateMicLevel = function(rms) {
    const bars = document.querySelectorAll('#waveform .wave-bar');
    const n = Math.min(rms / 60, 1);
    bars.forEach((bar, i) => {
        const h = 4 + n * 24 * (Math.sin(Date.now() / 200 + i * 0.8) * 0.3 + 0.7);
        bar.style.height = h + 'px';
    });
};

window.onSpeechStart = function() {
    setMicState('listening');
    setStatus('Mendengar...');
};

window.onTranscribing = function() {
    setMicState('processing');
    setStatus('Memproses...');
};

window.onTranscriptionResult = function(text) {
    processOrder(text);
};

// ===== START SESSION =====
function startSession() {
    document.getElementById('splash').classList.add('hide');
    setTimeout(() => {
        document.getElementById('splash').style.display = 'none';
        document.getElementById('app').style.display = 'flex';
        setStatus('Tekan mikrofon untuk mula');
    }, 300);
}

// ===== MIC TOGGLE =====
async function toggleMic() {
    if (earsStarted) return;
    if (isProcessing) return;
    setMicState('processing');
    setStatus('Memulakan mikrofon...');
    ears = new AlwaysOnEars();
    const ok = await ears.init();
    if (ok) {
        earsStarted = true;
        setMicState('listening');
        setStatus('Sedang mendengar...');
        document.getElementById('waveform').classList.remove('hidden');
        document.getElementById('micLabel').textContent = 'Sedang mendengar...';
    } else {
        setMicState('idle');
        setStatus('Sila benarkan mikrofon');
    }
}

// ===== PROCESS ORDER — Speed pipeline =====
async function processOrder(text) {
    if (!text || text.length < 2) return;
    if (isProcessing) return;

    isProcessing = true;
    if (ears) ears.pause();
    setMicState('processing');
    setStatus('Memproses...');

    // Show what was heard
    const transcript = document.getElementById('micTranscript');
    transcript.textContent = '"' + text + '"';
    transcript.style.display = 'block';

    const t0 = performance.now();

    try {
        const res = await fetch('/api/voice/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text, alternatives: [], order: order, table_number: TABLE })
        });
        const data = await res.json();
        const ms = Math.round(performance.now() - t0);
        console.log('[SPEED]', ms + 'ms', data.pipeline, data);

        // Handle actions
        if (data.action === 'confirm_order' && order.length > 0) {
            await submitOrder();
            return;
        }
        if (data.action === 'cancel_all') {
            order = [];
            renderOrder();
            setStatus('Pesanan dikosongkan');
        } else if (data.action === 'cancel_item' || data.action === 'cancel_by_index') {
            order = data.order || [];
            renderOrder();
            setStatus('Item dibuang');
        } else if (data.action === 'cancel_request') {
            setStatus('Sebut nama item untuk dibuang');
        } else if (data.action === 'add_items' && data.new_items && data.new_items.length) {
            order = data.order || order;
            renderOrder();
            setStatus(ms + 'ms');
        } else if (data.action === 'no_items') {
            setStatus('Tiada pesanan lagi');
        } else {
            setStatus('Sila sebut pesanan anda');
        }
    } catch(e) {
        console.error('[Order] Error:', e);
        setStatus('Ralat. Cuba lagi.');
    }

    isProcessing = false;
    if (ears) ears.resume();
    if (earsStarted) {
        setMicState('listening');
        document.getElementById('waveform').classList.remove('hidden');
        document.getElementById('micLabel').textContent = 'Sedang mendengar...';
    }

    // Clear transcript after delay
    setTimeout(() => { transcript.style.display = 'none'; }, 3000);
}

// ===== RENDER ORDER TABLE =====
function renderOrder() {
    const empty = document.getElementById('orderEmpty');
    const table = document.getElementById('orderTable');
    const body = document.getElementById('orderBody');
    const btn = document.getElementById('btnHantar');

    if (order.length === 0) {
        empty.style.display = '';
        table.style.display = 'none';
        btn.disabled = true;
        return;
    }

    empty.style.display = 'none';
    table.style.display = '';
    btn.disabled = false;

    body.innerHTML = '';
    let total = 0;
    order.forEach((item, idx) => {
        const lineTotal = (item.price || 0) * (item.qty || 1);
        total += lineTotal;
        const mods = (item.modifiers && item.modifiers.length) ? '<span class="item-mods">' + esc(item.modifiers.join(', ')) + '</span>' : '';
        const tr = document.createElement('tr');
        tr.innerHTML =
            '<td><span class="item-name">' + esc(item.name) + '</span>' + mods + '</td>' +
            '<td><span class="item-qty">' + (item.qty || 1) + '</span></td>' +
            '<td>RM' + lineTotal.toFixed(2) + '</td>' +
            '<td><button class="item-remove" data-idx="' + idx + '">&times;</button></td>';
        body.appendChild(tr);
    });

    document.getElementById('orderTotal').textContent = 'RM' + total.toFixed(2);

    // Attach remove handlers
    body.querySelectorAll('.item-remove').forEach(btn => {
        btn.addEventListener('click', function() {
            const i = parseInt(this.dataset.idx);
            order.splice(i, 1);
            renderOrder();
        });
    });
}

// ===== HANTAR PESANAN =====
async function hantarPesanan() {
    if (order.length === 0) return;
    const btn = document.getElementById('btnHantar');
    btn.disabled = true;
    btn.textContent = 'Menghantar...';
    if (ears) ears.pause();

    await submitOrder();
}

async function submitOrder() {
    const orderItems = order.map(i => ({
        name: i.name, qty: i.qty || 1, price: i.price || 0, modifiers: i.modifiers || []
    }));
    const orderTotal = orderItems.reduce((s, i) => s + i.price * i.qty, 0);

    try {
        const res = await fetch('/api/voice/order', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ table_number: TABLE, items: orderItems, total: orderTotal })
        });
        const data = await res.json();
        if (data.status === 'sent') {
            showOrderSent();
        } else {
            setStatus('Ralat menghantar pesanan');
            document.getElementById('btnHantar').disabled = false;
            document.getElementById('btnHantar').textContent = 'HANTAR PESANAN';
        }
    } catch(e) {
        setStatus('Ralat rangkaian');
        document.getElementById('btnHantar').disabled = false;
        document.getElementById('btnHantar').textContent = 'HANTAR PESANAN';
    }

    isProcessing = false;
}

function showOrderSent() {
    document.getElementById('app').style.display = 'none';
    document.getElementById('orderSent').classList.add('show');
    setTimeout(() => {
        document.getElementById('orderSent').classList.remove('show');
        document.getElementById('app').style.display = 'flex';
        order = [];
        renderOrder();
        isProcessing = false;
        earsStarted = false;
        if (ears) { ears.destroy(); ears = null; }
        document.getElementById('btnHantar').textContent = 'HANTAR PESANAN';
        document.getElementById('btnHantar').disabled = true;
        setMicState('idle');
        document.getElementById('waveform').classList.add('hidden');
        // Reset to splash
        const splash = document.getElementById('splash');
        splash.style.display = '';
        splash.classList.remove('hide');
        document.getElementById('app').style.display = 'none';
    }, 8000);
}

// ===== MIC STATE =====
function setMicState(s) {
    const b = document.getElementById('micBtn');
    b.className = 'mic-btn';
    if (s === 'listening') { b.classList.add('listening'); b.textContent = '\uD83C\uDF99\uFE0F'; }
    else if (s === 'processing') { b.classList.add('processing'); b.textContent = '\u23F3'; }
    else { b.textContent = '\uD83C\uDF99\uFE0F'; }
}

function setStatus(t) { document.getElementById('statusText').textContent = t; }
function esc(t) { return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
</script>
